<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Societário — Lucralize</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;700&family=Poppins:wght@400;500;600;700&display=swap">
<style>
  :root{
    --bg:#F5F7F8;
    --surface:#FFFFFF;
    --surface-2:#EDF2F4;
    --surface-3:#E1E8EB;
    --ink:#17202B;
    --ink-soft:#57626F;
    --ink-faint:#8B96A2;
    --primary:#0C7488;
    --primary-strong:#095668;
    --primary-soft:#E1F0F2;
    --chrome:#0E1428;
    --chrome-strong:#080B15;
    --brand-cyan:#92DCE5;
    --success:#2F7D5D;
    --success-bg:#E4F3EC;
    --warning:#B4650B;
    --warning-bg:#FBEEE0;
    --danger:#F72642;
    --danger-bg:#FDE9EC;
    --border:#DEE4E8;
    --shadow:0 1px 2px rgba(15,25,45,.04), 0 8px 24px -12px rgba(15,25,45,.18);
    --radius-s:8px;
    --radius-m:12px;
    --radius-l:18px;
    --font-display:'Comfortaa', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-body:'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-mono:'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0B0F17;
      --surface:#121826;
      --surface-2:#1A2231;
      --surface-3:#232C3D;
      --ink:#E8EDF3;
      --ink-soft:#A7B2C2;
      --ink-faint:#6E7A8C;
      --primary:#4FC3D6;
      --primary-strong:#8FE0EC;
      --primary-soft:#153A42;
      --success:#6BCBA1;
      --success-bg:#173229;
      --warning:#E5A660;
      --warning-bg:#3A2712;
      --danger:#FF7A90;
      --danger-bg:#3D1620;
      --border:#2A3341;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 28px -14px rgba(0,0,0,.6);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0B0F17;
    --surface:#121826;
    --surface-2:#1A2231;
    --surface-3:#232C3D;
    --ink:#E8EDF3;
    --ink-soft:#A7B2C2;
    --ink-faint:#6E7A8C;
    --primary:#4FC3D6;
    --primary-strong:#8FE0EC;
    --primary-soft:#153A42;
    --success:#6BCBA1;
    --success-bg:#173229;
    --warning:#E5A660;
    --warning-bg:#3A2712;
    --danger:#FF7A90;
    --danger-bg:#3D1620;
    --border:#2A3341;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 28px -14px rgba(0,0,0,.6);
    color-scheme: dark;
  }

  *{box-sizing:border-box; min-width:0;}
  html, body{overflow-x:hidden; max-width:100%;}
  body{background:var(--bg); color:var(--ink); font-family:var(--font-body); margin:0; -webkit-font-smoothing:antialiased;}
  h1,h2,h3,h4{font-family:var(--font-body); font-weight:600; margin:0; text-wrap:balance; color:var(--ink);}
  p{margin:0;}
  button{font-family:inherit; cursor:pointer;}
  ::selection{background:var(--primary-soft); color:var(--primary-strong);}
  a{color:inherit;}
  .mono{font-family:var(--font-mono); font-variant-numeric:tabular-nums;}
  .u-scroll-x{overflow-x:auto;}
  button:focus-visible, a:focus-visible, input:focus-visible, [tabindex]:focus-visible{
    outline:2px solid var(--primary); outline-offset:2px; border-radius:4px;
  }
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms !important; transition-duration:.001ms !important;} }

  /* ---------- Buttons ---------- */
  .btn{display:inline-flex; align-items:center; justify-content:center; gap:.5em; padding:.65em 1.1em; border-radius:var(--radius-s); border:1px solid transparent; font-size:.92rem; font-weight:600; line-height:1; transition:transform .12s ease, box-shadow .12s ease, background .12s ease;}
  .btn:active{transform:translateY(1px);}
  .btn-primary{background:var(--chrome); color:#fff;}
  .btn-primary:hover{background:var(--chrome-strong);}
  .btn-teal{background:var(--primary); color:#fff;}
  .btn-teal:hover{background:var(--primary-strong);}
  .btn-accent{background:var(--primary-soft); color:var(--primary-strong); border-color:var(--primary);}
  .btn-accent:hover{background:var(--primary); color:#fff;}
  .btn-ghost{background:transparent; color:var(--ink); border-color:var(--border);}
  .btn-ghost:hover{background:var(--surface-2);}
  .btn-subtle{background:var(--surface-2); color:var(--ink);}
  .btn-subtle:hover{background:var(--surface-3);}
  .btn-danger{background:transparent; color:var(--danger); border-color:var(--border);}
  .btn-danger:hover{background:var(--danger-bg);}
  .btn-block{width:100%;}
  .btn-sm{padding:.45em .8em; font-size:.82rem;}
  .btn[disabled]{opacity:.5; cursor:not-allowed;}

  /* ---------- Login screen ---------- */
  .login-wrap{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:2rem; background:
    radial-gradient(1200px 600px at 15% -10%, var(--primary-soft), transparent 60%),
    radial-gradient(900px 500px at 110% 10%, var(--primary-soft), transparent 55%),
    var(--bg);}
  .login-grid{display:grid; grid-template-columns:1.05fr 1fr; gap:0; max-width:960px; width:100%; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-l); overflow:hidden; box-shadow:var(--shadow);}
  .login-pitch{
    background:
      radial-gradient(1100px 720px at 6% -8%, rgba(12,116,136,.9), transparent 55%),
      radial-gradient(820px 620px at 46% 18%, rgba(12,116,136,.4), transparent 62%),
      linear-gradient(155deg, var(--chrome) 0%, var(--chrome-strong) 78%);
    color:#fff; padding:2.8rem 2.4rem; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:1.9rem;
  }
  .login-pitch .brand-logo{height:38px; width:auto; display:block; margin:0 auto;}
  .login-pitch h1{color:#fff; font-size:1.05rem; font-weight:500; line-height:1.5; max-width:320px; color:rgba(255,255,255,.85);}
  .login-pitch p{color:rgba(255,255,255,.78); font-size:.93rem; line-height:1.55;}
  .login-features{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:.7rem; width:100%; max-width:320px;}
  .login-features li{display:flex; align-items:center; gap:.85rem; padding:.8rem .95rem; border-radius:var(--radius-m); background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.14); text-align:left;}
  .login-features .ic{width:36px; height:36px; border-radius:10px; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.16); display:flex; align-items:center; justify-content:center; flex:none; font-size:1rem; color:var(--brand-cyan);}
  .login-features .txt{font-size:.83rem; font-weight:600; color:rgba(255,255,255,.92); line-height:1.35;}
  .login-form-side{padding:2.6rem 2.4rem; display:flex; flex-direction:column; gap:1.4rem;}
  .proto-badge{align-self:flex-start; font-size:.68rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--primary-strong); background:var(--primary-soft); padding:.3em .7em; border-radius:999px;}
  .field{display:flex; flex-direction:column; gap:.4rem;}
  .field label{font-size:.78rem; font-weight:600; color:var(--ink-soft);}
  .field input, .field textarea, .field select{padding:.65em .8em; border-radius:var(--radius-s); border:1px solid var(--border); background:var(--surface); color:var(--ink); font-size:.92rem; font-family:inherit;}
  .field textarea{resize:vertical; line-height:1.5;}
  .field input:disabled{color:var(--ink-faint);}
  .login-form-side .field label{font-size:.7rem; font-weight:700; text-transform:uppercase; letter-spacing:.07em; color:var(--ink-faint);}
  .login-form-side .field input{padding:.8em .9em; font-size:.95rem;}
  .link-esqueci{background:none; border:none; padding:.2rem; color:var(--primary); font-size:.85rem; font-weight:600; font-family:inherit; cursor:pointer; text-align:center;}
  .link-esqueci:hover{text-decoration:underline; color:var(--primary-strong);}

  .q-block{display:flex; flex-direction:column; gap:.6rem; padding:1.05rem 1.1rem; border:1px solid var(--border); border-radius:var(--radius-m); background:var(--surface-2);}
  .q-block .q-title{font-size:.9rem; font-weight:700; color:var(--ink); line-height:1.4;}
  .q-block .q-num{color:var(--primary); margin-right:.35em;}
  .obs-note{font-size:.78rem; color:var(--ink-soft); line-height:1.55; background:var(--primary-soft); padding:.65rem .8rem; border-radius:var(--radius-s); white-space:pre-line;}
  .obs-note strong{color:var(--ink);}
  .txt-danger-strong{color:var(--danger); font-weight:800;}
  .radio-group{display:flex; flex-direction:column; gap:.5rem;}
  .radio-option{display:flex; align-items:flex-start; gap:.6rem; padding:.65rem .8rem; border:1px solid var(--border); border-radius:var(--radius-s); background:var(--surface); cursor:pointer; font-size:.86rem; line-height:1.4;}
  .radio-option:has(input:checked){border-color:var(--primary); background:var(--primary-soft);}
  .radio-option input{margin-top:.2rem; flex:none;}
  .socio-block{border:1px dashed var(--border); border-radius:var(--radius-m); padding:1rem 1.1rem; display:flex; flex-direction:column; gap:.8rem; background:var(--surface);}
  .socio-block .socio-head{font-size:.78rem; font-weight:700; color:var(--primary-strong); text-transform:uppercase; letter-spacing:.05em;}
  .req-mark{color:var(--danger); margin-left:.2em;}

  .upload-list{display:flex; flex-direction:column; gap:.6rem;}
  .upload-row{display:flex; align-items:center; justify-content:space-between; gap:.8rem; padding:.65rem .85rem; border:1px solid var(--border); border-radius:var(--radius-s); background:var(--surface-2);}
  .upload-row.attached{border-color:var(--success); background:var(--success-bg);}
  .upload-row-label{display:flex; align-items:center; gap:.55rem; font-size:.84rem; font-weight:500; min-width:0;}
  .upload-row .req-dot{width:6px; height:6px; border-radius:50%; background:var(--ink-faint); flex:none;}
  .upload-row.attached .req-dot{background:var(--success);}
  .file-picker{display:flex; align-items:center; gap:.4em; padding:.4em .8em; border-radius:var(--radius-s); background:var(--surface); border:1px solid var(--border); font-size:.78rem; font-weight:600; color:var(--ink-soft); flex:none; white-space:nowrap; max-width:170px; overflow:hidden; text-overflow:ellipsis; cursor:pointer;}
  .file-picker:hover{border-color:var(--primary); color:var(--primary);}
  .upload-row.attached .file-picker{color:var(--success); border-color:var(--success);}
  .file-picker .txt{overflow:hidden; text-overflow:ellipsis;}
  .divider-label{display:flex; align-items:center; gap:.75rem; color:var(--ink-faint); font-size:.72rem; letter-spacing:.06em; text-transform:uppercase;}
  .divider-label::before, .divider-label::after{content:''; flex:1; height:1px; background:var(--border);}
  .demo-list{display:flex; flex-direction:column; gap:.55rem;}
  .demo-card{display:flex; align-items:center; gap:.75rem; text-align:left; padding:.7rem .8rem; border-radius:var(--radius-s); border:1px solid var(--border); background:var(--surface);}
  .demo-card:hover{border-color:var(--primary); background:var(--primary-soft);}
  .demo-avatar{width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:.78rem; flex:none;}
  .demo-meta{display:flex; flex-direction:column; gap:.1rem; min-width:0;}
  .demo-meta strong{font-size:.86rem;}
  .demo-meta span{font-size:.75rem; color:var(--ink-soft); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .role-chip{margin-left:auto; font-size:.65rem; font-weight:700; letter-spacing:.05em; text-transform:uppercase; padding:.25em .55em; border-radius:999px; flex:none;}
  .role-chip.cliente{background:var(--primary-soft); color:var(--primary);}
  .role-chip.admin{background:var(--chrome); color:#fff;}
  .role-chip.colaborador{background:var(--warning-bg); color:var(--warning);}
  .role-chip.freelancer{background:var(--success-bg); color:var(--success);}

  /* ---------- App shell ---------- */
  .shell{display:grid; grid-template-columns:248px 1fr; min-height:100vh;}
  .sidebar{background:var(--chrome-strong); color:#fff; display:flex; flex-direction:column; padding:1.4rem 1.1rem; gap:1.6rem; position:sticky; top:0; min-height:100vh;}
  .brand{display:flex; flex-direction:column; align-items:center; text-align:center; gap:.65rem; padding:.4rem .3rem .6rem;}
  .brand .brand-logo{height:34px; width:auto; display:block; margin:0 auto;}
  .brand .brand-caption{font-family:var(--font-display); font-weight:700; font-size:.86rem; letter-spacing:.12em; text-transform:uppercase; color:rgba(255,255,255,.72);}
  .nav-group{display:flex; flex-direction:column; gap:.2rem;}
  .nav-label{font-size:.66rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:rgba(255,255,255,.45); padding:.4rem .6rem 0;}
  .nav-item{display:flex; align-items:center; gap:.65rem; padding:.6rem .7rem; border-radius:var(--radius-s); color:rgba(255,255,255,.82); font-size:.87rem; font-weight:500; background:transparent; border:none; text-align:left; width:100%;}
  .nav-item .ic{width:18px; text-align:center; flex:none;}
  .nav-item:hover{background:rgba(255,255,255,.08); color:#fff;}
  .nav-item.active{background:rgba(255,255,255,.14); color:#fff; font-weight:600;}
  .nav-item.active::before{content:''; }
  .sidebar-foot{margin-top:auto; display:flex; flex-direction:column; gap:.6rem; border-top:1px solid rgba(255,255,255,.14); padding-top:1rem;}
  .user-pill{display:flex; align-items:center; gap:.6rem;}
  .user-pill .demo-avatar{background:rgba(255,255,255,.16); color:#fff;}
  .user-pill .who{min-width:0;}
  .user-pill .who strong{display:block; font-size:.82rem; color:#fff; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .user-pill .who span{font-size:.72rem; color:rgba(255,255,255,.6);}

  .main{min-width:0;}
  .topbar{display:flex; align-items:center; justify-content:space-between; gap:1rem; padding:1.1rem 2rem; border-bottom:1px solid var(--border); background:var(--surface); position:sticky; top:0; z-index:5;}
  .topbar h2{font-size:1.15rem;}
  .topbar .crumb{font-size:.76rem; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.08em; margin-bottom:.15rem;}
  .content{padding:1.8rem 2.4rem 3rem; max-width:1560px;}

  .theme-toggle{display:flex; gap:.25rem; background:var(--surface-2); border-radius:999px; padding:.2rem;}
  .theme-toggle button{border:none; background:transparent; padding:.35em .6em; border-radius:999px; font-size:.75rem; color:var(--ink-soft);}
  .theme-toggle button.active{background:var(--surface); color:var(--ink); box-shadow:var(--shadow);}

  /* ---------- Generic pieces ---------- */
  .card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-m); box-shadow:var(--shadow);}
  .section-title{display:flex; align-items:baseline; justify-content:space-between; gap:1rem; margin-bottom:1rem;}
  .section-title h3{font-size:1.05rem;}
  .eyebrow{font-size:.68rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-faint);}

  .pill{display:inline-flex; align-items:center; gap:.4em; font-size:.72rem; font-weight:700; letter-spacing:.02em; padding:.3em .65em; border-radius:999px; white-space:nowrap;}
  .pill-dot{width:6px; height:6px; border-radius:50%; background:currentColor;}
  .pill.status-aguardando_pagamento{background:var(--warning-bg); color:var(--warning);}
  .pill.status-em_andamento{background:var(--primary-soft); color:var(--primary);}
  .pill.status-concluido{background:var(--success-bg); color:var(--success);}
  .pill.status-cancelado{background:var(--danger-bg); color:var(--danger);}
  .pill.tag-confirmado{background:var(--success-bg); color:var(--success);}
  .pill.tag-estimado{background:var(--warning-bg); color:var(--warning);}

  .kpi-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:1rem; margin-bottom:1.6rem;}
  .kpi{padding:1.1rem 1.2rem; display:flex; flex-direction:column; gap:.35rem;}
  .kpi .label{font-size:.74rem; color:var(--ink-soft); font-weight:600;}
  .kpi .value{font-family:var(--font-display); font-size:1.7rem; font-weight:700;}
  .kpi .sub{font-size:.72rem; color:var(--ink-faint);}

  .kpi-mes-head{display:flex; align-items:center; justify-content:space-between; gap:.5rem;}
  .kpi-mes-nav{display:flex; align-items:center; gap:.25rem; flex:none;}
  .kpi-mes-nav button{width:22px; height:22px; border-radius:6px; border:1px solid var(--border); background:var(--surface); color:var(--ink-soft); font-size:.85rem; line-height:1; display:flex; align-items:center; justify-content:center; padding:0;}
  .kpi-mes-nav button:hover{border-color:var(--primary); color:var(--primary);}
  .kpi-mes-nav button:disabled{opacity:.35; cursor:not-allowed;}
  .kpi-mes-nav button:disabled:hover{border-color:var(--border); color:var(--ink-soft);}

  .competencia-bar{display:flex; align-items:center; justify-content:space-between; gap:1rem; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-m); padding:.7rem 1.1rem; margin-bottom:1.2rem;}
  .kpi-mes-nav-lg button{width:28px; height:28px; font-size:1rem;}
  .kpi-mes-nav-lg{gap:.7rem;}
  .competencia-label{font-family:var(--font-display); font-size:1rem; min-width:130px; text-align:center; color:var(--ink);}

  .kpi-grid.tipo-kpi-grid{grid-template-columns:repeat(4,1fr);}
  .tipo-kpi{text-align:left; width:100%; cursor:pointer; transition:border-color .12s ease, box-shadow .12s ease, background .12s ease;}
  .tipo-kpi:hover{border-color:var(--primary);}
  .tipo-kpi.active{border-color:var(--primary); background:var(--primary-soft); box-shadow:0 0 0 1px var(--primary) inset;}
  .tipo-kpi .label{display:flex; align-items:center; gap:.5rem;}
  .tipo-kpi-ic{width:26px; height:26px; border-radius:8px; background:var(--primary-soft); color:var(--primary-strong); display:flex; align-items:center; justify-content:center; font-size:.82rem; flex:none;}
  .tipo-kpi.active .tipo-kpi-ic{background:var(--primary); color:#fff;}
  @media (max-width:900px){ .kpi-grid.tipo-kpi-grid{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:520px){ .kpi-grid.tipo-kpi-grid{grid-template-columns:1fr;} }

  .cat-block{margin-bottom:2.2rem;}
  .svc-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(260px,1fr)); gap:1rem;}
  .svc-card{padding:1.15rem 1.2rem; display:flex; flex-direction:column; gap:.7rem; text-align:left; border:1px solid var(--border);}
  .svc-card:hover{border-color:var(--primary);}
  .svc-card .nome{font-size:1rem; font-family:var(--font-body); font-weight:600;}
  .svc-card .resumo{font-size:.82rem; color:var(--ink-soft); line-height:1.45;}
  .svc-card .preco-row{display:flex; align-items:baseline; justify-content:space-between; gap:.5rem; margin-top:auto; padding-top:.6rem; border-top:1px dashed var(--border);}
  .svc-card .preco{font-family:var(--font-mono); font-weight:600; font-size:1.02rem; color:var(--primary);}
  :root[data-theme="dark"] .svc-card .preco{color:var(--primary-strong);}
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .svc-card .preco{color:var(--primary-strong);} }
  .svc-card .preco small{display:block; font-family:var(--font-body); font-weight:500; font-size:.66rem; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.05em;}

  /* overlay / modal */
  .overlay{position:fixed; inset:0; background:rgba(10,15,25,.5); display:flex; justify-content:flex-end; z-index:50; animation:fade .15s ease;}
  @keyframes fade{from{opacity:0} to{opacity:1}}
  .panel{width:min(560px, 100%); height:100%; background:var(--surface); box-shadow:-16px 0 40px rgba(0,0,0,.2); display:flex; flex-direction:column; animation:slide .18s ease;}
  .panel-wide{width:min(860px, 96vw);}
  @keyframes slide{from{transform:translateX(24px); opacity:.6} to{transform:translateX(0); opacity:1}}
  .panel-head{padding:1.4rem 1.6rem 1rem; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; gap:1rem; align-items:flex-start;}
  .panel-body{padding:1.3rem 1.6rem 2rem; overflow-y:auto; flex:1; display:flex; flex-direction:column; gap:1.4rem;}
  .panel-foot{padding:1rem 1.6rem; border-top:1px solid var(--border); display:flex; gap:.7rem; justify-content:flex-end;}
  .close-x{background:var(--surface-2); border:none; width:30px; height:30px; border-radius:50%; font-size:1rem; color:var(--ink-soft); flex:none;}
  .close-x:hover{background:var(--surface-3);}

  .modal-center{position:fixed; inset:0; background:rgba(10,15,25,.5); display:flex; align-items:center; justify-content:center; z-index:60; padding:1.5rem;}
  .modal-box{width:min(480px,100%); max-height:100%; background:var(--surface); border-radius:var(--radius-l); box-shadow:var(--shadow); overflow:hidden; display:flex; flex-direction:column;}
  .modal-box .panel-head, .modal-box .panel-body, .modal-box .panel-foot{padding-left:1.5rem; padding-right:1.5rem;}

  .info-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:.9rem;}
  .info-block{display:flex; flex-direction:column; gap:.3rem;}
  .info-block .lbl{font-size:.68rem; font-weight:700; text-transform:uppercase; letter-spacing:.07em; color:var(--ink-faint);}
  .info-block .val{font-size:.92rem; font-weight:600;}

  table{border-collapse:collapse; width:100%; font-size:.86rem;}
  th{text-align:left; font-size:.68rem; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-faint); font-weight:700; padding:.6rem .8rem; border-bottom:1px solid var(--border);}
  td{padding:.75rem .8rem; border-bottom:1px solid var(--border); vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  tr.clickable:hover{background:var(--surface-2); cursor:pointer;}

  .price-table{width:100%; font-size:.83rem; border-collapse:collapse;}
  .price-table th, .price-table td{padding:.5rem .3rem; border-bottom:1px solid var(--border);}
  .price-table td.v{font-family:var(--font-mono); text-align:right; font-weight:600;}
  .price-table tr.mine{background:var(--primary-soft);}
  .price-table tr.mine td{font-weight:700;}

  .doc-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:.5rem;}
  .doc-list li{display:flex; gap:.6rem; align-items:flex-start; font-size:.86rem; line-height:1.4;}
  .doc-list li .ic{color:var(--primary); flex:none; margin-top:.15em;}

  .file-row{display:flex; align-items:center; gap:.7rem; padding:.7rem .85rem; border:1px solid var(--border); border-radius:var(--radius-s); background:var(--surface-2);}
  .file-row .ic{width:32px; height:32px; border-radius:8px; background:var(--primary-soft); color:var(--primary); display:flex; align-items:center; justify-content:center; flex:none; font-size:.85rem;}
  .file-row .name{font-size:.85rem; font-weight:600; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

  /* stepper */
  .stepper{display:flex; flex-direction:column; gap:0;}
  .step{display:flex; gap:.9rem;}
  .step .rail{display:flex; flex-direction:column; align-items:center; flex:none;}
  .step .node{width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.72rem; font-weight:700; border:2px solid var(--border); background:var(--surface); color:var(--ink-faint); flex:none;}
  .step .line{width:2px; flex:1; background:var(--border); min-height:22px;}
  .step:last-child .line{display:none;}
  .step.concluida .node{background:var(--success); border-color:var(--success); color:#fff;}
  .step.concluida .line{background:var(--success);}
  .step.atual .node{background:var(--surface); border-color:var(--primary); color:var(--primary-strong); box-shadow:0 0 0 4px var(--primary-soft);}
  .step-body{padding-bottom:1.5rem; flex:1; min-width:0;}
  .step-body .title{font-size:.9rem; font-weight:600;}
  .step.pendente .step-body .title{color:var(--ink-faint); font-weight:500;}
  .step-body .when{font-size:.74rem; color:var(--ink-faint); margin-top:.1rem;}
  .step-body .note{font-size:.8rem; color:var(--ink-soft); margin-top:.35rem; background:var(--surface-2); padding:.55rem .7rem; border-radius:var(--radius-s);}

  .banner-proto{display:flex; align-items:center; gap:.6rem; background:var(--primary-soft); color:var(--primary-strong); padding:.55rem 1rem; border-radius:var(--radius-s); font-size:.78rem; font-weight:600; margin-bottom:1.4rem;}

  .form-grid{display:grid; grid-template-columns:1fr 1fr; gap:.9rem;}
  .form-grid .full{grid-column:1 / -1;}
  .filtro-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(180px,1fr)); gap:.9rem;}
  @media (max-width:900px){ .filtro-grid{grid-template-columns:1fr 1fr;} }
  @media (max-width:560px){ .filtro-grid{grid-template-columns:1fr;} }

  th input.th-filtro, th select.th-filtro{display:block; width:100%; margin-top:.5rem; font-size:.76rem; font-weight:500; text-transform:none; letter-spacing:normal; color:var(--ink); padding:.4em .55em; border-radius:6px; border:1px solid var(--border); background:var(--surface); font-family:inherit;}

  .empty-state{display:flex; flex-direction:column; align-items:center; text-align:center; gap:.6rem; padding:3rem 1.5rem; color:var(--ink-soft);}

  @media (max-width: 880px){
    .shell{grid-template-columns:1fr;}
    .sidebar{position:relative; height:auto; flex-direction:row; align-items:center; flex-wrap:wrap;}
    .sidebar-foot{margin-top:0; margin-left:auto; border:none; padding:0;}
    .nav-group{flex-direction:row; flex-wrap:wrap;}
    .login-grid{grid-template-columns:1fr;}
    .login-pitch{display:none;}
    .kpi-grid{grid-template-columns:repeat(2,1fr);}
    .form-grid{grid-template-columns:1fr;}
    .content{padding:1.2rem;}
    .topbar{padding:1rem 1.2rem;}
  }

  /* ---------- Responsivo: telas públicas do link sem login (WhatsApp/celular) ---------- */
  .detalhe-grid{grid-template-columns:1fr 1fr;}
  @media (max-width: 780px){
    .detalhe-grid{grid-template-columns:1fr !important;}
    .lp-wide-wrap{padding:1rem !important;}
  }
  @media (max-width: 480px){
    .login-wrap{padding:.9rem !important;}
    .login-wrap > .card{padding:1.3rem 1.1rem !important; max-width:100% !important;}
    .lp-wide-wrap{padding:.75rem !important;}
  }

  /* ---------- página inicial (cliente / funcionário) ---------- */
  .home-wrap{
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:2rem 1.2rem; color:#fff;
    background:
      radial-gradient(1100px 720px at 6% -8%, rgba(12,116,136,.9), transparent 55%),
      radial-gradient(820px 620px at 70% 105%, rgba(12,116,136,.45), transparent 62%),
      linear-gradient(155deg, var(--chrome) 0%, var(--chrome-strong) 78%);
  }
  .home-inner{width:100%; max-width:460px; display:flex; flex-direction:column; align-items:center; gap:1.5rem; text-align:center;}
  .home-logo{height:46px; width:auto; display:block;}
  .home-tag{margin:0; font-size:.95rem; color:rgba(255,255,255,.8);}
  .home-choices{width:100%; display:flex; flex-direction:column; gap:.9rem;}
  .home-choice{display:flex; flex-direction:column; gap:.2rem; text-align:left; cursor:pointer; font-family:inherit; color:#fff;
    padding:1.15rem 1.3rem; border-radius:var(--radius-m); background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.2); transition:background .15s, border-color .15s;}
  .home-choice:hover{background:rgba(255,255,255,.13); border-color:var(--brand-cyan);}
  .home-choice:disabled{opacity:.6; cursor:wait;}
  .home-choice strong{font-size:1.05rem; font-weight:600;}
  .home-choice span{font-size:.82rem; color:rgba(255,255,255,.75);}
  .home-msg{width:100%; text-align:left; font-size:.85rem; border-radius:var(--radius-s); padding:.7rem .9rem; background:rgba(247,38,66,.20); color:#fff; border:1px solid var(--danger); white-space:pre-line;}   /* sempre sobre o fundo escuro da página inicial: legível nos temas claro e escuro */
  .home-card{width:100%; text-align:left; background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.2); border-radius:var(--radius-m); padding:1.3rem 1.4rem; display:flex; flex-direction:column; gap:.8rem;}
  .home-card h2{font-size:1.2rem; color:#fff;}
  .home-card p{margin:0; color:rgba(255,255,255,.8); font-size:.9rem; white-space:pre-line;}
  .home-back{align-self:flex-start; background:transparent; border:1px solid rgba(255,255,255,.3); color:#fff; border-radius:var(--radius-s); padding:.5em 1em; font-family:inherit; font-weight:600; font-size:.85rem; cursor:pointer;}
  .home-back:hover{border-color:var(--brand-cyan); color:var(--brand-cyan);}
  .home-foot{font-size:.72rem; color:rgba(255,255,255,.5);}

  /* ---------- área do cliente ---------- */
  .cli-card{width:100%; text-align:left; background:var(--surface); color:var(--ink); border-radius:var(--radius-m); padding:1.4rem 1.5rem; display:flex; flex-direction:column; gap:.95rem; box-shadow:0 20px 60px -24px rgba(0,0,0,.6);}
  .cli-card h2{font-size:1.2rem; color:var(--ink);}
  .cli-txt{margin:0; font-size:.88rem; color:var(--ink-soft); line-height:1.5;}
  .cli-sub{font-size:.82rem; color:var(--ink-soft);}
  .cli-eyebrow{font-size:.66rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-faint);}
  .cli-meta{display:flex; align-items:center; gap:.7rem; flex-wrap:wrap;}
  .cli-input{width:100%; padding:.8em .9em; border-radius:var(--radius-s); border:1px solid var(--border); background:var(--surface); color:var(--ink); font-size:1.15rem; letter-spacing:.08em; text-align:center; text-transform:uppercase;}
  .cli-input:focus{outline:2px solid var(--primary-soft); border-color:var(--primary);}
  .cli-erro{font-size:.82rem; background:var(--danger-bg); border:1px solid var(--danger); border-radius:var(--radius-s); padding:.6rem .8rem; color:var(--ink);}
  .cli-aviso{font-size:.84rem; background:var(--warning-bg); border:1px solid var(--warning); border-radius:var(--radius-s); padding:.75rem .9rem; color:var(--ink); line-height:1.5;}
  .cli-aviso .mono{font-weight:700; letter-spacing:.06em;}
  .cli-card .btn-primary{background:#0C7488; border-color:#0C7488; color:#fff;}   /* cor fixa da marca: bom contraste nos dois temas */
  .cli-card .btn-primary:hover{background:#095668; border-color:#095668;}
  .cli-card .btn-primary:disabled{opacity:.65; cursor:wait;}

  /* ---------- pedidos de clientes (aba "Processos sem OS") ---------- */
  .pill.status-solicitado{background:var(--warning-bg); color:var(--warning);}
  .pill.status-recusado{background:var(--danger-bg); color:var(--danger);}
  .nav-item .nav-badge{margin-left:auto; background:#F72642; color:#fff; border-radius:999px; font-size:.68rem; font-weight:700; min-width:20px; height:20px; padding:0 .45em; display:inline-flex; align-items:center; justify-content:center;}
</style>
</head>

   Para a tela não "voltar atrás" (item excluído que reaparece, status antigo), o portal lembra por alguns minutos o que ele
   mesmo gravou ou apagou, e usa isso no lugar de uma leitura ainda desatualizada. */
var XL_RECENTES_TTL = 180000;
var _xlRecentes = {};     /* tabela -> { id: {t, apagado, row, sigDepois, anteriores[]} } */
function xlLembrarGravacao(t, row, sigAntes, sigDepois){
  var rec = (_xlRecentes[t] = _xlRecentes[t] || {}), prev = rec[row.id], ant = [];
  if(prev && !prev.apagado){ ant = prev.anteriores.concat([prev.sigDepois]); }
  if(sigAntes !== undefined && ant.indexOf(sigAntes) === -1) ant.push(sigAntes);
  rec[row.id] = { t: Date.now(), apagado: false, row: JSON.parse(JSON.stringify(row)), sigDepois: sigDepois, anteriores: ant };
}
function xlLembrarExclusao(t, id){ (_xlRecentes[t] = _xlRecentes[t] || {})[id] = { t: Date.now(), apagado: true }; }
/* ajusta o resultado de uma leitura com o que o portal acabou de gravar/apagar */
function xlAplicarRecentes(t, out, reais){
  var rec = _xlRecentes[t]; if(!rec) return;
  var agora = Date.now();
  Object.keys(rec).forEach(function(id){
    var e = rec[id];
    if(agora - e.t > XL_RECENTES_TTL){ delete rec[id]; return; }
    var i = -1; for(var k = 0; k < out.length; k++){ if(out[k].id === id){ i = k; break; } }
    if(e.apagado){
      if(i === -1) delete rec[id];                 /* o Excel já refletiu a exclusão */
      else out.splice(i, 1);                       /* leitura antiga: continua escondido */
      return;
    }
    if(i === -1){ out.push(JSON.parse(JSON.stringify(e.row))); return; }    /* ainda não apareceu: usa o que gravamos */
    var lida = reais[id];
    if(lida === e.sigDepois) delete rec[id];                                /* o Excel já refletiu */
    else if(e.anteriores.indexOf(lida) !== -1) out[i] = JSON.parse(JSON.stringify(e.row));   /* versão antiga: usa a nossa */
    else delete rec[id];                                                    /* outra pessoa alterou depois: vale o Excel */
  });
}

async function msUploadGrande(caminho, file){
  var ses = await msGraph('POST', '/drives/' + SP.driveId + '/root:/' + msEncPath(caminho) + ':/createUploadSession', { item: { '@microsoft.graph.conflictBehavior': 'rename' } });
  var url = ses && ses.uploadUrl;
  if(!url) throw new Error('A Microsoft não abriu a sessão de envio.');
  var total = file.size, ini = 0;
  try{
    while(ini < total){
      var fim = Math.min(ini + UP_PARTE, total), parte = file.slice(ini, fim), ok = false, ultimo = null;
      for(var t = 1; t <= 3 && !ok; t++){
        var ctl = new AbortController(), tm = setTimeout(function(){ ctl.abort(); }, 180000);
        try{
          /* a URL da sessão já vem autorizada: NÃO se envia o token aqui */
          var r = await fetch(url, { method: 'PUT', headers: { 'Content-Range': 'bytes ' + ini + '-' + (fim - 1) + '/' + total }, body: parte, signal: ctl.signal });
          if(r.status === 200 || r.status === 201 || r.status === 202) ok = true; else throw new Error('HTTP ' + r.status);
        }catch(e){ ultimo = e; console.error('Envio em partes (tentativa ' + t + '):', e); if(t < 3) await msEspera(1500 * t); }
        finally{ clearTimeout(tm); }
      }
      if(!ok) throw ultimo || new Error('Falha no envio.');
      ini = fim;
      if(typeof toast === 'function' && ini < total) toast('Enviando arquivo… ' + Math.round(ini * 100 / total) + '%');
    }
  }catch(e){
    try{ await fetch(url, { method: 'DELETE' }); }catch(e2){}      /* cancela a sessão para não deixar arquivo pela metade */
    throw e;
  }
}
function msEspera(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
async function msGraph(method, path, body, extra, tent){
  tent = tent || 0;
  var h = Object.assign({ 'Authorization': 'Bearer ' + _msToken, 'Content-Type': 'application/json' }, extra || {});
  if(_wbSessionId && path.indexOf('/workbook/') !== -1 && !h['workbook-session-id']) h['workbook-session-id'] = _wbSessionId;
  var opts = { method: method, headers: h, cache: 'no-store' };
  if(body !== undefined) opts.body = typeof body === 'string' ? body : JSON.stringify(body);
  var url = 'https://graph.microsoft.com/v1.0' + path;
  /* anti-cache só nos endpoints de drive/workbook; o /me rejeita parâmetros desconhecidos (400) */
  if(method === 'GET' && path.indexOf('/me') !== 0) url += (url.indexOf('?') === -1 ? '?' : '&') + '_cb=' + Date.now();
  var res = await fetch(url, opts);
  if(res.status === 401 && tent === 0){ await msSilencioso(); return msGraph(method, path, body, extra, 1); }
  if((res.status === 429 || res.status === 503) && tent < 4){
    var ra = parseInt(res.headers.get('Retry-After') || '2', 10);
    await msEspera(Math.min(Math.max(ra, 1), 10) * 1000);
    return msGraph(method, path, body, extra, tent + 1);
  }
  if(!res.ok){
    var tx = await res.text();
    var e = new Error('Graph ' + method + ' ' + path.split('?')[0] + ' -> ' + res.status + ': ' + tx.slice(0, 300));
    e.status = res.status; throw e;
  }
  if(res.status === 204) return null;
  return res.json();
}
async function msGraphRaw(method, path, buf, ct, tent){
  var res = await fetch('https://graph.microsoft.com/v1.0' + path, { method: method, headers: { 'Authorization': 'Bearer ' + _msToken, 'Content-Type': ct || 'application/octet-stream' }, body: buf });
  if(res.status === 401 && !tent){ await msSilencioso(); return msGraphRaw(method, path, buf, ct, 1); }
  if(!res.ok){ var tx = await res.text(); var e = new Error('Graph ' + method + ' ' + path.split('?')[0] + ' -> ' + res.status + ': ' + tx.slice(0, 300)); e.status = res.status; throw e; }
  return res.json();
}

function xlNorm(s){ return String(s == null ? '' : s).trim().toLowerCase(); }
function xlParse(s){ try{ return s ? JSON.parse(s) : {}; }catch(e){ return {}; } }
function xlJoin(c, chunks){ return chunks.map(function(k){ return String(c[k] == null ? '' : c[k]); }).join(''); }
function xlSplit(str, chunks){
  if(str.length > XL_CHUNK * chunks.length) throw new Error('Registro grande demais para uma linha da planilha (' + str.length + ' caracteres).');
  var out = {}, pos = 0;
  chunks.forEach(function(k){
    var fim = Math.min(pos + XL_CHUNK, str.length);
    if(fim < str.length){ var cc = str.charCodeAt(fim - 1); if(cc >= 0xD800 && cc <= 0xDBFF) fim--; }  /* não corta um emoji ao meio */
    out[k] = str.slice(pos, fim); pos = fim;
  });
  return out;
}
function xlCanon(v){
  if(Array.isArray(v)) return '[' + v.map(xlCanon).join(',') + ']';
  if(v && typeof v === 'object') return '{' + Object.keys(v).sort().map(function(k){ return JSON.stringify(k) + ':' + xlCanon(v[k]); }).join(',') + '}';
  return JSON.stringify(v === undefined ? null : v);
}

  for(var i = 0; i < raw.length; i++){
    if(xlBlank(raw[i])) continue;
    var s = cfg.shape(xlCellsDe(cfg, raw[i]));
    if(s.id === id) return i;
  }
  return -1;
}
async function xlSelect(t, forcar){
  var c = _xlCache[t];
  if(!forcar && c && Date.now() - c.t < 3000) return JSON.parse(c.json);
  var cfg = XLT[t], raw = await xlRaw(t), out = [], sigs = {}, reais = {};
  raw.forEach(function(arr){
    if(xlBlank(arr)) return;
    var cells = xlCellsDe(cfg, arr), row = cfg.shape(cells);
    if(!row.id) return;
    sigs[row.id] = xlSig(t, row); reais[row.id] = sigs[row.id]; out.push(row);
    /* processo que já tem código mas cujas colunas Codigo/Publico estão vazias ou diferentes: marca para regravar no próximo salvamento */
    if(t === 'processos' && row.dados.codigoAcompanhamento && (String(cells.Codigo || '') !== row.dados.codigoAcompanhamento || !cells.Publico)) sigs[row.id] = '__atualizar_colunas__';
  });
  xlAplicarRecentes(t, out, reais);
  Object.keys(sigs).forEach(function(id){ if(!out.some(function(r){ return r.id === id; })) delete sigs[id]; });
  out.forEach(function(r){ if(sigs[r.id] === undefined) sigs[r.id] = xlSig(t, r); });
  _xlBaseSig[t] = sigs;
  _xlCache[t] = { t: Date.now(), json: JSON.stringify(out) };
  return out;
}
/* O freelancer só enxerga os processos atribuídos a ele. (Atenção: isto é só de tela; o isolamento
   real depende da permissão do arquivo no SharePoint.) */
function xlFiltrarPapel(t, rows){
  if(_xlUser && _xlUser.role === 'freelancer'){
    if(t === 'processos') return rows.filter(function(r){ return r.responsavel_id === _xlUser.id; });
    if(t === 'processos_excluidos') return [];
  }
  return rows;
}
/* escritas: uma de cada vez (fila), cada lote numa sessão persistente do Excel */
function xlEnfileirar(fn){
  var p = _xlFila.then(function(){ return xlComSessao(fn); });
  _xlFila = p.catch(function(){});
  return p;
}
async function xlComSessao(fn){
  await xlItem();
  try{
    var s = await msGraph('POST', '/drives/' + SP.driveId + '/items/' + _wbItemId + '/workbook/createSession', { persistChanges: true });
    _wbSessionId = s.id;
  }catch(e){ console.warn('Sem sessão persistente do Excel; seguindo sem ela:', e); _wbSessionId = null; }
  try{
    return await fn();
  }finally{
    var sid = _wbSessionId; _wbSessionId = null;
    if(sid){ try{ await msGraph('POST', '/drives/' + SP.driveId + '/items/' + _wbItemId + '/workbook/closeSession', undefined, { 'workbook-session-id': sid }); }catch(e){ console.warn('closeSession:', e); } }
  }
}
async function xlGravar(t, rows, naoAtualizaBase){
  /* grava TODAS as linhas recebidas; quem chama já separou o que mudou (ver XQ._run) */
  var cfg = XLT[t];
  if(!rows.length) return rows;
  await xlEnfileirar(async function(){
    var raw = await xlRaw(t);
    for(var i = 0; i < rows.length; i++){
      var row = rows[i];
      var cells = cfg.unshape(row), sig = xlSig(t, row);
      var arr = cfg.cols.map(function(k){ return cells[k] == null ? '' : cells[k]; });
      var idx = xlFindIdx(t, raw, row.id);
      if(idx < 0) idx = raw.findIndex(xlBlank);              /* reaproveita a linha vazia que o Excel exige */
      if(idx >= 0){ await msGraph('PATCH', xlRowsUrl(t) + '/itemAt(index=' + idx + ')', { values: [arr] }); raw[idx] = arr; }
      else { await msGraph('POST', xlRowsUrl(t) + '/add', { values: [arr] }); raw.push(arr); }
      xlLembrarGravacao(t, row, (_xlBaseSig[t] || {})[row.id], sig);
      if(!naoAtualizaBase){ (_xlBaseSig[t] = _xlBaseSig[t] || {})[row.id] = sig; }
    }
  });
  delete _xlCache[t];
  return rows;
}
async function xlRemover(t, id){
  var removidos = 0, cfg = XLT[t];
  await xlEnfileirar(async function(){
    var raw = await xlRaw(t), idx = xlFindIdx(t, raw, id);
    if(idx < 0) return;
    var restantes = raw.filter(function(r, i){ return i !== idx && !xlBlank(r); }).length;
    if(raw.length <= 1 || restantes === 0){        /* o Excel não aceita tabela sem nenhuma linha: limpa em vez de apagar */
      await msGraph('PATCH', xlRowsUrl(t) + '/itemAt(index=' + idx + ')', { values: [cfg.cols.map(function(){ return ''; })] });
    } else {
      await msGraph('DELETE', xlRowsUrl(t) + '/itemAt(index=' + idx + ')');
    }
    removidos = 1;
  });
  if(removidos) xlLembrarExclusao(t, id);
  if(_xlBaseSig[t]) delete _xlBaseSig[t][id];
  delete _xlCache[t];
  return removidos;
}

/* ---------- número da OS: maior número do ano entre processos e excluídos (+1) ---------- */
async function xlProximaOS(){
  var ano = new Date().getFullYear(), max = 0;
  function considera(os){ var m = /^OS-(\d+)\/(\d{4})$/.exec(String(os || '').trim()); if(m && parseInt(m[2], 10) === ano) max = Math.max(max, parseInt(m[1], 10)); }
  for(var t of ['processos', 'processos_excluidos']){
    var cfg = XLT[t], col = cfg.cols.indexOf('OS');
    (await xlRaw(t)).forEach(function(arr){ considera(arr[col]); });
  }
  /* OS gravadas há pouco, que a leitura ainda pode não mostrar, e as que a própria tela já conhece */
  Object.keys(_xlRecentes.processos || {}).forEach(function(id){ var e = _xlRecentes.processos[id]; if(e.row && e.row.dados) considera(e.row.dados.ordemServico); });
  (typeof state !== 'undefined' && state.processes || []).forEach(function(p){ considera(p.ordemServico); });
  (typeof state !== 'undefined' && state.processosExcluidos || []).forEach(function(x){ considera(x.ordemServico); });
  return 'OS-' + String(max + 1).padStart(3, '0') + '/' + ano;
}
async function xlRegistrarAcesso(){
  if(!_xlUser) return;
  var rows = await xlSelect('usuarios', true);
  var r = rows.filter(function(x){ return x.id === _xlUser.id; })[0];
  if(!r) return;
  r.dados.ultimoAcesso = new Date().toISOString();
  await xlGravar('usuarios', [r], true);      /* não atualiza a assinatura-base: evita regravar depois */
}
async function xlCriarUsuario(body){
  var rows = await xlSelect('usuarios', true), email = xlNorm(body.email);
  if(rows.some(function(r){ return xlNorm(r.dados.email) === email; })) return { data: { erro: 'Já existe um usuário com este e-mail.' }, error: null };
  var id = 'u' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  var d = { id: id, nome: body.nome, email: String(body.email).trim(), telefone: body.telefone || '—', role: body.role, empresaId: null, ativo: true };
  await xlGravar('usuarios', [{ id: id, role: body.role, empresa_id: null, senha_provisoria: false, dados: d }]);
  return { data: { id: id, senha: '' }, error: null };
}

/* ---------- API de acesso aos dados (usada pelo app como "planilha.*") ---------- */
function XQ(t){ this.t = t; this.op = 'select'; this.f = []; this.payload = null; this.sel = false; this.one = null; }
XQ.prototype.select = function(){ if(this.op !== 'select') this.sel = true; return this; };
XQ.prototype.upsert = function(r){ this.op = 'upsert'; this.payload = [].concat(r); return this; };
XQ.prototype.insert = function(r){ this.op = 'insert'; this.payload = [].concat(r); return this; };
XQ.prototype.update = function(o){ this.op = 'update'; this.payload = o; return this; };
XQ.prototype.delete = function(){ this.op = 'delete'; return this; };
XQ.prototype.eq = function(c, v){ this.f.push([c, v]); return this; };
XQ.prototype.single = function(){ this.one = 'single'; return this; };
XQ.prototype.maybeSingle = function(){ this.one = 'maybe'; return this; };
XQ.prototype.then = function(a, b){ return this._run().then(a, b); };
XQ.prototype._filtra = function(rows){
  return this.f.reduce(function(acc, ff){ return acc.filter(function(r){ return String(r[ff[0]]) === String(ff[1]); }); }, rows);
};
XQ.prototype._run = async function(){
  try{
    var t = this.t, data;
    if(!XLT[t]) throw new Error('Tabela desconhecida: ' + t);
    if(this.op === 'select'){
      data = this._filtra(xlFiltrarPapel(t, await xlSelect(t, false)));
    } else if(this.op === 'upsert' || this.op === 'insert'){
      /* decide AGORA, antes de qualquer espera, o que mudou desde a última leitura: assim uma
         tela desatualizada nunca regrava por cima do que outra pessoa salvou */
      var forcar = this.op === 'insert', base = _xlBaseSig[t] || {};
      var sujas = this.payload.filter(function(row){ return forcar || base[row.id] !== xlSig(t, row); });
      await xlGravar(t, sujas);
      data = this.payload;
    } else if(this.op === 'update'){
      var alvo = this._filtra([this.payload]);
      await xlGravar(t, alvo);
      data = alvo;
    } else if(this.op === 'delete'){
      var ids = this.f.filter(function(ff){ return ff[0] === 'id'; }).map(function(ff){ return ff[1]; });
      data = [];
      for(var i = 0; i < ids.length; i++){ if(await xlRemover(t, String(ids[i]))) data.push({ id: ids[i] }); }
    }
    if(this.one){
      if(!data.length){ return this.one === 'maybe' ? { data: null, error: null } : { data: null, error: { message: 'Nenhum registro encontrado.' } }; }
      return { data: data[0], error: null };
    }
    return { data: data, error: null };
  }catch(e){
    console.error('[planilha] ' + this.op + ' ' + this.t + ':', e);
    return { data: null, error: { message: e.message } };
  }
};
var planilha = {
  from: function(t){ return new XQ(t); },
  rpc: async function(nome, args){
    try{
      if(nome === 'gerar_ordem_servico') return { data: await xlProximaOS(), error: null };
      if(nome === 'liberar_numero_os') return { data: null, error: null };       /* a OS é calculada pelo maior número existente: ao apagar, o número volta sozinho */
      if(nome === 'registrar_ultimo_acesso'){ await xlRegistrarAcesso(); return { data: null, error: null }; }
    }catch(e){ console.error('[planilha] rpc ' + nome + ':', e); return { data: null, error: { message: e.message } }; }
    return { data: null, error: { message: 'Função indisponível nesta versão: ' + nome } };
  },
  functions: { invoke: async function(nome, opts){
    try{
      if(nome === 'criar-usuario') return await xlCriarUsuario(opts.body);
    }catch(e){ console.error('[planilha] criar-usuario:', e); return { data: null, error: { message: e.message } }; }
    return { data: null, error: { message: 'Função indisponível: ' + nome } };
  } },
  arquivos: {
    upload: async function(path, file){
      try{
        if(file.size > UP_SIMPLES_MAX){ await msUploadGrande(SP.docsFolder + '/' + path, file); return { data: { path: path }, error: null }; }
        var buf = await file.arrayBuffer();
        await msGraphRaw('PUT', '/drives/' + SP.driveId + '/root:/' + msEncPath(SP.docsFolder + '/' + path) + ':/content', buf, file.type || 'application/octet-stream');
        return { data: { path: path }, error: null };
      }catch(e){ console.error('[sharepoint] upload:', e); return { data: null, error: { message: e.message } }; }
    },
    remove: async function(paths){
      try{
        for(var i = 0; i < paths.length; i++){
          try{ await msGraph('DELETE', '/drives/' + SP.driveId + '/root:/' + msEncPath(SP.docsFolder + '/' + paths[i])); }
          catch(e){ if(e.status !== 404) throw e; }      /* já não existe: tudo certo */
        }
        return { data: paths, error: null };
      }catch(e){ console.error('[sharepoint] remover:', e); return { data: null, error: { message: e.message } }; }
    },
    createSignedUrl: async function(path){
      try{
        var it = await msGraph('GET', '/drives/' + SP.driveId + '/root:/' + msEncPath(SP.docsFolder + '/' + path));
        var url = it['@microsoft.graph.downloadUrl'] || it.webUrl;
        return url ? { data: { signedUrl: url }, error: null } : { data: null, error: { message: 'Arquivo sem link de download.' } };
      }catch(e){ console.error('[sharepoint] download:', e); return { data: null, error: { message: e.message } }; }
    }
  }
};

function sanitizeFileName(nome){
  return String(nome||'arquivo').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-zA-Z0-9.\-_]+/g,'_').slice(0,140);
}
/* Tenta novamente automaticamente (com pequenas pausas) antes de desistir —
   importante para conexões de internet instáveis (ex.: navegador embutido
   do WhatsApp em rede móvel), onde uma falha isolada não deve virar erro
   definitivo para o cliente. */
async function comRetentativa(fn, tentativas, delayMs){
  tentativas = tentativas || 3;
  delayMs = delayMs || 700;
  var ultimoErro;
  for(var i=0; i<tentativas; i++){
    try{
      return await fn();
    }catch(e){
      ultimoErro = e;
      if(i < tentativas-1) await new Promise(function(r){ setTimeout(r, delayMs*(i+1)); });
    }
  }
  throw ultimoErro;
}
async function uploadArquivoReal(file, processoId, subpasta){
  if(!file) return null;
  if(!currentUser()) return registrarAnexoDoCliente(file, subpasta);   /* cliente: o arquivo sobe depois que o pedido receber o código */
  var path = processoId+'/'+subpasta+'/'+Date.now()+'-'+sanitizeFileName(file.name);
  if(file.size > UP_MAX_BYTES){ var eg = new Error('O arquivo tem mais de 100 MB. Reduza o tamanho e tente de novo.'); eg.amigavel = true; throw eg; }
  if(file.size > UP_SIMPLES_MAX){      /* arquivo grande: envio em partes, que já tem novas tentativas próprias */
    var upG = await planilha.arquivos.upload(path, file, {upsert:false});
    if(upG.error) throw upG.error;
    return {nome:file.name, path:path};
  }
  return await comRetentativa(async function(){
    var up = await planilha.arquivos.upload(path, file, {upsert:false});
    if(up.error) throw up.error;
    return {nome:file.name, path:path};
  });
}
async function baixarArquivoReal(path){
  if(!path){ toast('Arquivo não disponível para download.'); return; }
  try{
    var res = await planilha.arquivos.createSignedUrl(path, 3600);
    if(res.error || !res.data){ toast(res.error && /404/.test(res.error.message || '') ? 'Arquivo não encontrado na pasta. Se veio do cliente, o envio pode não ter terminado: peça para ele reenviar.' : 'Não foi possível gerar o link de download.'); return; }
    window.open(res.data.signedUrl, '_blank');
  }catch(e){
    console.error(e);
    toast('Não foi possível gerar o link de download.');
  }
}

var MESES_PT = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

/* ---- conversão entre o formato usado no app (state.users/companies/processes)
   e as linhas das tabelas da planilha (colunas de apoio + dados completos em JSON,
   para não perder nenhum campo aninhado) ---- */
function usuarioParaRow(u){
  var dados = Object.assign({}, u);
  delete dados.senha;
  return {id:u.id, role:u.role, empresa_id:u.empresaId||null, senha_provisoria: !!u.senhaProvisoria, dados:dados};
}
function rowParaUsuario(row){
  var u = Object.assign({}, row.dados);
  u.id = row.id;
  u.role = row.role;
  u.empresaId = row.empresa_id;
  u.senhaProvisoria = row.senha_provisoria;
  return u;
}
function empresaParaRow(c){ return {id:c.id, dados:c}; }
function rowParaEmpresa(row){ var c = Object.assign({}, row.dados); c.id = row.id; return c; }
function processoParaRow(p){ return {id:p.id, empresa_id:p.empresaId||null, responsavel_id:p.responsavelId||null, dados:p}; }
function rowParaProcesso(row){ var p = Object.assign({}, row.dados); p.id = row.id; completarCaminhosDoCliente(p); return iniciarSemPagamento(p); }
function excluidoParaRow(x){ return {id:x.id, dados:x}; }
function rowParaExcluido(row){ var x = Object.assign({}, row.dados); x.id = row.id; return x; }

/* ---- envia para a planilha o que mudou em memória; um erro em uma tabela (por
   exemplo, falta de permissão) nunca interrompe as outras ---- */
function sincronizarPlanilha(){
  if(!_xlUser) return;      /* só a equipe logada grava na planilha */
  var u = currentUser();
  if(state.processes && state.processes.length){
    planilha.from('processos').upsert(state.processes.map(processoParaRow)).then(function(r){ if(r.error){ console.warn('Sincronizar processos:', r.error.message); toast('Não foi possível salvar na planilha: '+r.error.message); } });
  }
  if(u && (u.role==='admin' || u.role==='colaborador')){
    if(state.processosExcluidos && state.processosExcluidos.length){
      planilha.from('processos_excluidos').upsert(state.processosExcluidos.map(excluidoParaRow)).then(function(r){ if(r.error){ console.warn('Sincronizar excluídos:', r.error.message); toast('Não foi possível salvar na planilha: '+r.error.message); } });
    }
    if(state.companies && state.companies.length){
      planilha.from('empresas').upsert(state.companies.map(empresaParaRow)).then(function(r){ if(r.error){ console.warn('Sincronizar empresas:', r.error.message); toast('Não foi possível salvar na planilha: '+r.error.message); } });
    }
  }
  if(u && u.role==='admin' && state.users && state.users.length){
    planilha.from('usuarios').upsert(state.users.map(usuarioParaRow)).then(function(r){ if(r.error){ console.warn('Sincronizar usuários:', r.error.message); toast('Não foi possível salvar na planilha: '+r.error.message); } });
  }
}

/* ---- carrega da planilha tudo que o usuário autenticado pode ver (a camada de
   dados já filtra por papel) ---- */
async function carregarDadosAutenticados(authUserId){
  var perfilResp = await planilha.from('usuarios').select('*').eq('id', authUserId).single();
  if(perfilResp.error || !perfilResp.data) return false;
  var uPerfil = rowParaUsuario(perfilResp.data);
  var resultados = await Promise.all([
    planilha.from('usuarios').select('*'),
    planilha.from('empresas').select('*'),
    planilha.from('processos').select('*'),
    planilha.from('processos_excluidos').select('*')
  ]);
  var erroCarga = resultados.filter(function(r){ return r.error; })[0];
  if(erroCarga) throw new Error(erroCarga.error.message);
  state.users = (resultados[0].data||[]).map(rowParaUsuario);
  if(!state.users.some(function(x){ return x.id===uPerfil.id; })) state.users.push(uPerfil);
  state.companies = (resultados[1].data||[]).map(rowParaEmpresa);
  state.processes = (resultados[2].data||[]).map(rowParaProcesso);
  state.processosExcluidos = (resultados[3].data||[]).map(rowParaExcluido);
  var maiorOS = 0;
  state.processes.forEach(function(p){
    var m = /OS-(\d+)\//.exec(p.ordemServico||'');
    if(m){ var n = parseInt(m[1],10); if(n>maiorOS) maiorOS = n; }
  });
  state.nextOrdemSeq = maiorOS + 1;
  state.session = {userId: uPerfil.id};
  return true;
}

/* ---------- Atualização em segundo plano (sem precisar recarregar a página) ----------
   Antes, os processos só eram buscados do servidor no login (equipe/cliente logado)
   ou na busca inicial pelo número da OS (visitante do link público). Depois disso,
   cada tela ficava com a cópia que já tinha em memória — então se o cliente mandasse
   uma observação, ou a equipe alterasse algo, quem já estava com a outra tela aberta
   só via a mudança dando F5 na página inteira. Isso dava a impressão de que a
   informação "não tinha sido gravada" ou "não aparecia pra equipe", mesmo já estando
   salva no banco. As funções abaixo buscam os dados mais recentes por conta própria,
   sem que a pessoa precise recarregar nada. */
function algumCampoEmEdicao(){
  var el = document.activeElement;
  return !!(el && (el.tagName==='TEXTAREA' || el.tagName==='INPUT' || el.tagName==='SELECT'));
}
async function atualizarDadosDoServidorSilenciosamente(){
  try{
    if(state.session){
      var res = await planilha.from('processos').select('*');
      if(!res.error && res.data){
        state.processes = res.data.map(rowParaProcesso);
        if(!algumCampoEmEdicao()) render();
      }
    }
  }catch(e){
    console.error('Atualização em segundo plano falhou (tentando de novo no próximo ciclo):', e);
  }
}
setInterval(atualizarDadosDoServidorSilenciosamente, 20000);

/* ---------- Aviso de nova versão publicada ----------
   Como este app é uma página só, uma aba que já está aberta NUNCA busca sozinha
   o HTML/JS mais novo — mesmo que a Brenda publique uma correção, quem já
   estava com a tela aberta continua rodando o código antigo até dar um recarregar
   de verdade na página. Isso já causou mais de uma vez a impressão de que uma
   correção publicada "não funcionou". Este aviso aparece assim que detecta uma
   versão mais nova no ar, com um botão para atualizar num clique. */
async function verificarNovaVersaoDisponivel(){
  try{
    var r = await fetch(location.pathname + (location.pathname.indexOf('?')===-1?'?':'&') + '_v=' + Date.now(), {cache:'no-store'});
    var t = await r.text();
    var m = /BUILD_ID\s*=\s*'([^']+)'/.exec(t);
    if(m && m[1] && m[1]!==BUILD_ID) mostrarBannerNovaVersao();
  }catch(e){ /* silencioso — tenta de novo no próximo ciclo */ }
}

  if(!iso) return 'Nunca acessou';

function maskTelefone(el){
  var d = (el.value||'').replace(/\D/g,'').slice(0,11);
  var v = '';
  if(d.length>0) v = '('+d.slice(0,2);
  if(d.length>=2) v += ') ';
  if(d.length>2) v += d.length>10 ? d.slice(2,7) : d.slice(2,6);
  if(d.length>6) v += '-' + (d.length>10 ? d.slice(7,11) : d.slice(6,10));
  el.value = v;
}
function maskCnpj(el){
  var d = (el.value||'').replace(/\D/g,'').slice(0,14);
  el.value = d.replace(/^(\d{0,2})(\d{0,3})(\d{0,3})(\d{0,4})(\d{0,2}).*/, function(_, a,b,c,e,f){
    var out = a;
    if(b) out += '.'+b;
    if(c) out += '.'+c;
    if(e) out += '/'+e;
    if(f) out += '-'+f;
    return out;
  });
}
function maskDigitos(el, max){
  el.value = (el.value||'').replace(/\D/g,'').slice(0, max||20);
}
async function gerarOrdemServico(){
  /* o número é o maior da planilha no ano, mais 1 (ver xlProximaOS) */
  try{
    var data = await comRetentativa(async function(){
      var res = await planilha.rpc('gerar_ordem_servico');
      if(res.error) throw res.error;
      if(!res.data) throw new Error('RPC gerar_ordem_servico sem retorno');
      return res.data;
    });
    return data;
  }catch(e){
    console.error('Erro ao gerar número de ordem de serviço via RPC:', e);
  }
  /* fallback (só ocorre se a chamada ao banco falhar, ex.: sem internet) */
  var n = state.nextOrdemSeq++;
  var ano = new Date().getFullYear();
  return 'OS-'+String(n).padStart(3,'0')+'/'+ano;
}

async function salvarProcessoNoServidor(processo, ehNovo){
  /* Grava (ou atualiza) um processo na planilha. ehNovo=true é a criação; sem ele é a atualização de um
     processo que já existe. Só a equipe logada chega aqui: o cliente sem conta envia o pedido pelo fluxo
     "Criar" do Power Automate (ver enviarSolicitacaoPublica). Uma gravação que não devolve linha nenhuma
     também conta como falha. */
  try{
    if(!ehNovo){
      /* Evita perder atualizações concorrentes: como cada gravação envia o objeto
         `dados` inteiro (upsert substitui tudo), duas gravações quase simultâneas
         no mesmo processo (ex.: cliente manda uma observação e, antes da primeira
         confirmar, manda outra; ou a equipe Lucralize altera o processo enquanto o
         cliente também está com a tela aberta) faziam a segunda gravação, baseada
         numa cópia local desatualizada do histórico, apagar silenciosamente a
         entrada que a outra gravação tinha acabado de salvar no servidor — mesmo a
         tela de quem enviou por último mostrando "enviado com sucesso". Por isso,
         antes de gravar, buscamos o histórico mais recente do servidor e mesclamos
         com o histórico local, mantendo qualquer entrada nova de ambos os lados. */
      try{
        var atual = await planilha.from('processos').select('dados').eq('id', processo.id).maybeSingle();
        if(!atual.error && atual.data && atual.data.dados && Array.isArray(atual.data.dados.historico)){
          var histServidor = atual.data.dados.historico;
          var histLocal = Array.isArray(processo.historico) ? processo.historico : [];
          /* a chave de comparação é montada em ordem fixa, e não com JSON.stringify: a ordem das chaves de um
             objeto pode mudar numa ida e volta pela planilha, e isso duplicaria o histórico a cada gravação. */
          var chaveEntrada = function(h){ return (h.data||'')+'|'+(h.hora||'')+'|'+(h.texto||'')+'|'+(h.autor||'')+'|'+(h.tipo||''); };
          var chavesServidor = {};
          histServidor.forEach(function(h){ chavesServidor[chaveEntrada(h)] = true; });
          var extrasLocais = histLocal.filter(function(h){ return !chavesServidor[chaveEntrada(h)]; });
          processo.historico = histServidor.concat(extrasLocais);
        }
      }catch(eMerge){
        console.error('Não foi possível mesclar histórico antes de salvar (seguindo com o histórico local):', eMerge);
      }
    }
    await comRetentativa(async function(){
      var res = await planilha.from('processos').upsert([processoParaRow(processo)]).select();
      if(res.error) throw res.error;
      if(!res.data || !res.data.length) throw new Error('Nenhum processo salvo (0 linhas afetadas — verifique permissões).');
    });
    if(!ehNovo && Array.isArray(processo.historico)){
      /* mantém o objeto local em memória (state.processes) já mesclado, para a
         tela atual refletir imediatamente qualquer entrada que só existia no
         servidor até agora. */
      saveState();
    }
    return true;
  }catch(e){
    console.error('Erro ao salvar processo na planilha:', e);
    return false;
  }
}
async function finalizarNovoProcesso(processo, toastLogado){
  if(!currentUser()) return await enviarSolicitacaoPublica(processo);   /* cliente sem conta: vai pelo fluxo "Criar" */
  iniciarSemPagamento(processo);
  var u = currentUser();
  processo.ordemServico = await gerarOrdemServico();
  if(u){
    processo.empresaId = u.empresaId;
    var empresa = getCompany(u.empresaId);
    processo.divisao = empresa ? (empresa.divisao || null) : null;
    var fa = processo.formularioAbertura;
    var telPessoal = (fa && fa.telefoneOpcao==='pessoal') ? fa.telefonePessoal : '';
    var emailPessoal = (fa && fa.emailOpcao==='pessoal') ? fa.emailPessoal : '';
    processo.solicitanteContato = {telefone: telPessoal || u.telefone || '', email: emailPessoal || u.email || ''};
  } else {
    processo.empresaId = null;
    processo.visitante = state.visitante ? {nome:state.visitante.nome, telefone:state.visitante.telefone, email:state.visitante.email} : null;
    processo.divisao = null;
    processo.solicitanteContato = processo.visitante ? {telefone: processo.visitante.telefone||'', email: processo.visitante.email||''} : null;
  }

  /* salva de verdade no servidor ANTES de mostrar qualquer tela de sucesso —
     se a gravação falhar (sem internet, erro da planilha, etc.), o cliente
     precisa ver isso e poder tentar de novo, em vez de receber uma
     confirmação falsa enquanto nada foi realmente registrado. */
  var salvoComSucesso = await salvarProcessoNoServidor(processo, true);
  if(!salvoComSucesso){
    toast('Não foi possível enviar sua solicitação. Verifique sua internet e tente novamente.');
    return false;
  }

  state.processes.push(processo);
  saveState();
  closePanel();
  if(u){
    go({name:'cliente-processos'});
    toast(toastLogado || 'Formulário enviado com sucesso! Você receberá o boleto em breve.');
  } else {
    go({name:'link-publico', etapa:'confirmacao', ordemServico:processo.ordemServico});
  }
  return true;
}

/* ---------- Linha do tempo dinâmica por processo ----------
   Antes, cada serviço tinha uma lista fixa de etapas (service.etapas), igual
   para todo processo daquele serviço. A Brenda pediu duas coisas que isso não
   suportava: (1) toda vez que existir a etapa "Registro Digital na Junta
   Comercial", logo depois precisa aparecer "Em análise pela Junta Comercial";
   e (2) a Alteração Contratual (simples e complexa) precisa de um conjunto de
   etapas diferente dependendo do que o cliente selecionou no formulário —
   endereço/atividades/nome empresarial usa o fluxo completo (viabilidade até
   a análise da Junta), já quando é só capital social e/ou quadro societário
   o processo começa direto no DBE. Em nenhum dos dois casos de alteração o
   licenciamento aparece pro cliente — vira um item de controle interno (ver
   itensInternosDoProcesso). Por isso as etapas agora são calculadas por
   processo (etapasDoProcesso), a partir do que o cliente respondeu, e não
   mais fixas no catálogo. */
function alteracaoVarianteCompleta(dados){
  /* true = envolve endereço, atividades econômicas ou nome empresarial (usa o
     fluxo completo até a Junta); false = só capital social e/ou quadro
     societário (começa direto no DBE). Sem dados ainda (ex.: cadastro manual
     da equipe, sem o formulário do cliente) assume o fluxo mais completo. */
  if(!dados) return true;
  var tipos = dados.tipos || [];
  return tipos.indexOf('Endereço')!==-1 || tipos.indexOf('Atividades Econômicas')!==-1 || tipos.indexOf('Nome Empresarial')!==-1;
}
function inserirAnaliseJunta(lista){
  var idx = lista.indexOf('Registro Digital na Junta Comercial');
  if(idx!==-1 && lista.indexOf('Em análise pela Junta Comercial')===-1){
    lista = lista.slice(0, idx+1).concat(['Em análise pela Junta Comercial'], lista.slice(idx+1));
  }
  return lista;
}
function etapasDoProcesso(p){
  var s = SERVICE_MAP[p.servicoId];
  if(!s) return [];
  if(p.servicoId==='alteracao-simples' || p.servicoId==='alteracao-complexa'){
    var completa = alteracaoVarianteCompleta(p.formularioAlteracao);
    var lista = completa
      ? ['Viabilidade do nome e do endereço','Documento Básico de Entrada (DBE)','Módulo Integrador','Registro Digital na Junta Comercial']
      : ['Documento Básico de Entrada (DBE)','Módulo Integrador','Registro Digital na Junta Comercial'];
    return inserirAnaliseJunta(lista);
  }
  if(p.servicoId==='abertura-cnpj' || p.servicoId==='transformacao-mei-me'){
    /* Certificado Digital e Licenciamento e Alvará são controle interno (ver
       itensInternosDoProcesso) e não aparecem mais nesta lista visível ao
       cliente. A abertura conclui em "Inscrição do CNPJ e Regime Tributário";
       a transformação (que não tem essa etapa) conclui em "Em análise pela
       Junta Comercial". */
    var lista2 = ['Recebimento de informações','Viabilidade do nome e do endereço','Documento Básico de Entrada (DBE)','Módulo Integrador','Registro Digital na Junta Comercial'];
    lista2 = inserirAnaliseJunta(lista2);
    if(p.servicoId==='abertura-cnpj') lista2.push('Inscrição do CNPJ e Regime Tributário');
    return lista2;
  }
  return s.etapas || [];
}
/* Lista "base" usada só quando ainda não existe um processo real (ex.: o
   dropdown de etapas do cadastro manual) — assume o fluxo mais completo. */
function etapasBaseParaServico(servicoId){
  return etapasDoProcesso({servicoId:servicoId, formularioAbertura:{enderecoFiscalLucralize:true}, formularioAlteracao:{tipos:['Endereço']}});
}
/* Itens de controle interno: nunca aparecem pro cliente, só pra equipe, e
   ficam disponíveis pra marcar com um tique independente da etapa/índice do
   processo (ver renderProcessoDetalhe). Guardados em p.itensInternos, um
   objeto {rótulo: true/false}. */
function itensInternosDoProcesso(p){
  if(p.servicoId==='alteracao-simples' || p.servicoId==='alteracao-complexa'){
    return ['Licenciamento e Alvará'];
  }
  if(p.servicoId==='abertura-cnpj' || p.servicoId==='transformacao-mei-me'){
    return ['Certificado Digital','Licenciamento e Alvará','Portal Nacional','Acesso à Prefeitura'];
  }
  if(p.servicoId==='baixa-cnpj'){
    return ['Baixa nas esferas Estadual e Municipal'];
  }
  return [];
}
async function toggleItemInterno(id, item){
  var p = state.processes.filter(function(x){return x.id===id;})[0];
  if(!p) return;
  var snapshot = JSON.parse(JSON.stringify(p));
  p.itensInternos = p.itensInternos || {};
  p.itensInternos[item] = !p.itensInternos[item];
  saveState(); render();
  var ok = await salvarProcessoNoServidor(p);
  if(!ok){
    Object.assign(p, snapshot);
    saveState(); render();
    toast('Não foi possível salvar. Verifique sua internet e tente novamente.');
  }
}
function stepStates(process, service){
  var steps = etapasDoProcesso(process);
  var out = [];
  for(var i=0;i<steps.length;i++){
    var st;
    if(process.status==='aguardando_pagamento'){ st = 'pendente'; }
    else if(process.status==='concluido'){ st = 'concluida'; }
    else if(i < process.etapaAtual){ st='concluida'; }
    else if(i === process.etapaAtual){ st='atual'; }
    else{ st='pendente'; }
    out.push({label:(process.vistoriaNaoNecessaria && steps[i]===ETAPA_VISTORIA) ? 'Vistoria/análise do órgão — não necessária' : steps[i], state:st});
  }
  return out;
}

function toast(msg){
  var t = document.getElementById('toast');
  if(!t){
    t = document.createElement('div');
    t.id='toast';
    t.style.cssText='position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.75rem 1.2rem;border-radius:999px;font-size:.84rem;font-weight:600;box-shadow:var(--shadow);z-index:999;transition:opacity .2s;pointer-events:none;';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity='1';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.style.opacity='0'; }, 2600);
}

function applyTheme(){
  var root = document.documentElement;
  /* O link público (cliente sem login, ex.: enviado por WhatsApp) precisa
     sempre aparecer no tema claro, independente do celular/computador de
     quem está acessando estar no modo escuro do sistema — esse visitante
     não tem o seletor Claro/Sistema/Escuro (que só aparece pro usuário
     logado), então sem essa trava ele fica preso no escuro sem saber
     como mudar. */
  if(state.view && state.view.name==='link-publico'){ root.setAttribute('data-theme','light'); return; }
  if(state.theme==='dark') root.setAttribute('data-theme','dark');
  else if(state.theme==='light') root.setAttribute('data-theme','light');
  else root.removeAttribute('data-theme');
}
function setTheme(t){ state.theme=t; saveState(); applyTheme(); render(); }

function render(){
  applyTheme();

function msMensagemErro(err){
  var cod = (err && (err.errorCode || err.name)) || '';
  var msg = (err && err.message) || '';
  if(cod === 'user_cancelled') return 'Login cancelado.';
  if(cod === 'popup_window_error' || cod === 'empty_window_error') return 'O navegador bloqueou a janela de login. Libere os pop-ups para este site e tente de novo.';
  if(err && err.status === 404) return 'Não encontrei a planilha do portal. Confira se o arquivo está em:\n'+SP.workbookPath+'\ne se as abas/tabelas Usuarios, Empresas, Processos e ProcessosExcluidos existem.';
  if(err && err.status === 403) return 'Sua conta não tem permissão para abrir a planilha do portal. Fale com um administrador.';
  if(msg.indexOf('não está no modelo esperado') !== -1) return msg;
  return 'Não foi possível entrar. ' + msg;
}
async function entrarComContaMicrosoft(){
  state.view = {name:'carregando'}; render();
  var me = await msGraph('GET', '/me?$select=displayName,mail,userPrincipalName');
  var emails = [me.mail, me.userPrincipalName].filter(Boolean).map(xlNorm);
  var rows = await xlSelect('usuarios', true);
  var achado = rows.filter(function(r){ return emails.indexOf(xlNorm(r.dados.email)) !== -1; })[0];
  var motivo = null;
  if(!achado) motivo = 'Sua conta Microsoft ('+(emails[0]||'?')+') não está cadastrada na equipe do Portal Societário. Peça a um administrador para incluir seu e-mail.';
  else if(achado.dados.ativo === false) motivo = 'Seu acesso ao Portal Societário está inativo. Fale com um administrador.';
  else if(['admin','colaborador','freelancer'].indexOf(achado.role) === -1) motivo = 'Seu cadastro está sem um perfil válido (admin, colaborador ou freelancer). Fale com um administrador.';
  if(motivo){ semAcessoMsg = motivo; state.session = null; state.view = {name:'sem-acesso'}; render(); return; }
  _xlUser = {id: achado.id, role: achado.role};
  await login(achado.id);
  sincronizarPlanilha();      /* regrava só o que está desatualizado (ex.: colunas Codigo/Publico de processos antigos) */
}
async function entrarFuncionario(){
  homeMsg = '';
  var btn = document.getElementById('home-btn-func'); if(btn) btn.disabled = true;
  try{
    await msLoginInterativo();
    await entrarComContaMicrosoft();
  }catch(err){
    console.error(err);
    homeMsg = msMensagemErro(err);
    state.session = null; state.view = {name:'login'}; render();
  }
}

    ];
    items.splice(2, 0, {k:'admin-solicitacoes', ic:'✉', label:'Processos sem OS', badge:contarSolicitacoes()});

  var navHtml = items.map(function(it){
    var active = state.view.name===it.k;

  var body;

  else if(state.view.name==='admin-processos') body = renderAdminProcessos();

  else if(state.view.name==='admin-processo-detalhe') body = renderProcessoDetalhe(state.view.id, true, false);
  else body = '<div class="empty-state">Tela não encontrada.</div>';

  return ''+

      '<div class="brand"><img class="brand-logo" src="'+LOGO_DATA_URI+'" alt="Lucralize"><span class="brand-caption">Societário</span></div>'+

function renderCatalogo(company, adminMode, excludeCategorias){
  var cats = excludeCategorias ? CATEGORY_ORDER.filter(function(c){return excludeCategorias.indexOf(c)===-1;}) : CATEGORY_ORDER;
  var blocks = cats.map(function(cat){
    var items = SERVICES.filter(function(s){return s.categoria===cat;});
    var cards = items.map(function(s){
      var price = !s.precos ? null : (company ? priceForCompany(s, company) : (s.precos.length===1 ? s.precos[0] : null));
      var priceHtml = !s.precos ? 'Sem custo adicional' : (price ? fmtMoney(price.valor) : 'Consulte valores');
      var priceLabel = (s.precos && price) ? (price.tipo==='Valor único'||price.tipo==='A partir de'||price.tipo==='Valor único (todos os tipos)' ? (s.id==='alvara-funcionamento'?'a partir de · '+company_or_generic(company):'valor único') : 'para '+price.tipo) : '';
      return '<button class="card svc-card" onclick="PS.openService(\''+s.id+'\')">'+
        '<span class="eyebrow">'+esc(s.categoria)+'</span>'+
        '<span class="nome">'+esc(s.nome)+'</span>'+
        '<span class="resumo">'+esc(s.resumo)+'</span>'+
        '<span class="preco-row"><span class="preco">'+priceHtml+'<small>'+esc(priceLabel)+'</small></span><span style="font-size:.78rem; color:var(--primary); font-weight:600;">Ver detalhes</span></span>'+
      '</button>';
    }).join('');
    return '<div class="cat-block"><div class="section-title"><h3>'+esc(cat)+'</h3></div><div class="svc-grid">'+cards+'</div></div>';
  }).join('');
  var note = adminMode ? '<div class="banner-proto">'+seal(16)+' Modo consulta — os valores exibidos ao cliente variam conforme o tipo societário da empresa dele.</div>' : '';
  return note + blocks;
}

function onDocFileChosen(i){
  var input = document.getElementById('doc-'+i);
  var txt = document.getElementById('doc-'+i+'-txt');
  var row = input.closest('.upload-row');
  if(input.files && input.files[0]){
    txt.textContent = input.files[0].name;
    row.classList.add('attached');
  } else {
    txt.textContent = 'Anexar arquivo';
    row.classList.remove('attached');
  }
}
async function enviarSolicitacao(serviceId){
  var s = SERVICE_MAP[serviceId];
  var infoAdicional = (document.getElementById('sol-info')||{}).value || '';
  var submitBtn = document.getElementById('sol-submit-btn');
  if(submitBtn) submitBtn.disabled = true;

  var id = 'p'+Date.now();

  var documentosEnviados;
  try{
    documentosEnviados = await Promise.all(s.documentos.map(async function(nome, i){
      var input = document.getElementById('doc-'+i);
      var file = (input && input.files && input.files[0]) ? input.files[0] : null;
      if(!file) return {nome:nome, arquivo:null};
      var doc = await uploadArquivoReal(file, id, 'solicitacao');
      return {nome:nome, arquivo:doc.nome, path:doc.path, pendenteUpload:doc.pendenteUpload, nomeArq:doc.nomeArq};
    }));
  }catch(e){
    console.error('Erro ao enviar documentos da solicitação:', e);
    toast('Não foi possível enviar os documentos. Verifique sua internet e tente novamente.');
    if(submitBtn) submitBtn.disabled = false;
    return;
  }

  var anexados = documentosEnviados.filter(function(d){return d.arquivo;}).length;
  var total = documentosEnviados.length;

  var resumoTexto = 'Solicitação registrada pelo cliente no portal com '+anexados+' de '+total+' documento'+(total===1?'':'s')+' anexado'+(anexados===1?'':'s')+
    (infoAdicional.trim() ? ' e informações adicionais preenchidas.' : '.') + ' Aguardando envio do boleto.';

  var toastMsg = (anexados < total)
    ? ('Solicitação enviada! '+(total-anexados)+' documento(s) ainda pendente(s) — você pode enviá-los depois.')
    : 'Solicitação enviada com todos os documentos! Você receberá o boleto em breve.';

  var ok = await finalizarNovoProcesso({
    id:id, servicoId:serviceId, status:'aguardando_pagamento', etapaAtual:-1,
    criadoEm: todayISO(), protocolo:'',
    historico:[{data:todayISO(), hora:nowHM(), texto:resumoTexto, autor:'cliente'}],
    documentosAndamento:[], documentosFinais:[],
    solicitacaoInfo: infoAdicional,
    solicitacaoDocs: documentosEnviados
  }, toastMsg);
  if(!ok && submitBtn) submitBtn.disabled = false;
}

}
