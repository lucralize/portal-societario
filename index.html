function fabValidar(variant){
  var isTransf = variant === 'transformacao';
  var erros = [];
  function req(id, label){
    var el = document.getElementById(id);
    if(!el || !el.value || !el.value.trim()) erros.push(label);
  }
  function reqRadio(name, label){
    if(!document.querySelector('input[name="'+name+'"]:checked')) erros.push(label);
  }
  function reqFile(id, label){
    var el = document.getElementById(id);
    if(!el || !el.files || !el.files[0]) erros.push(label);
  }

  req('fab-q1-nome', 'Nome completo (pergunta 1)');

  if(isTransf){
    req('fab-transf-razaoatual', 'Razão Social (nome empresarial) - ATUAL');
    req('fab-transf-cnpj', 'Número do CNPJ');
  }

  reqRadio('fab-q2', 'Se a empresa terá outros sócios (pergunta 2)');
  var q2radio = document.querySelector('input[name="fab-q2"]:checked');
  if(q2radio && q2radio.value==='sim') req('fab-q2-qtd', 'Quantidade de sócios (pergunta 2)');

  reqRadio('fab-q3', 'Se irá utilizar o endereço fiscal Lucralize (pergunta 3)');
  var q3radio = document.querySelector('input[name="fab-q3"]:checked');
  if(q3radio && q3radio.value==='proprio'){
    req('fab-q3-endereco', 'Endereço (com CEP) da empresa em constituição (pergunta 3)');
    var iptuModo = document.querySelector('input[name="fab-q3-iptu-modo"]:checked');
    if(!iptuModo) erros.push('Guia de IPTU ou índice cadastral (pergunta 3)');
    else if(iptuModo.value==='upload') reqFile('fab-q3-iptu-file', 'Upload da guia de IPTU (pergunta 3)');
    else req('fab-q3-iptu-texto', 'Índice cadastral do IPTU (pergunta 3)');
    req('fab-q3-area', 'Área a ser utilizada pela empresa em m² (pergunta 3)');
  }

  req('fab-q4-razao1', '1ª opção de razão social (pergunta 4)');
  req('fab-q4-razao2', '2ª opção de razão social (pergunta 4)');
  req('fab-q6-capital', 'Valor do capital social (pergunta 6)');
  req('fab-q7-atividade', 'Atividade principal da empresa (pergunta 7)');
  req('fab-q8-secundarias', 'Atividades secundárias (pergunta 8)');

  var n = fabNumSocios();
  for(var i=1;i<=n;i++){
    req('fab-s'+i+'-nome', 'Nome completo do sócio '+i+' (pergunta 9)');
    req('fab-s'+i+'-titulo', 'Título de eleitor do sócio '+i+' (pergunta 9)');
    req('fab-s'+i+'-endereco', 'Endereço completo do sócio '+i+' (pergunta 9)');
    reqFile('fab-s'+i+'-foto', 'Documento de identificação com foto do sócio '+i+' (pergunta 9)');
    var irModo = document.querySelector('input[name="fab-s'+i+'-ir-modo"]:checked');
    if(irModo){
      if(irModo.value==='arquivo'){
        reqFile('fab-s'+i+'-ir-2025', 'Upload do recibo de IR 2025 do sócio '+i+' (pergunta 9)');
        reqFile('fab-s'+i+'-ir-2026', 'Upload do recibo de IR 2026 do sócio '+i+' (pergunta 9)');
      } else {
        req('fab-s'+i+'-ir-numero-2025', 'Número da declaração de IR 2025 do sócio '+i+' (pergunta 9)');
        req('fab-s'+i+'-ir-numero-2026', 'Número da declaração de IR 2026 do sócio '+i+' (pergunta 9)');
      }
    }
    var civilSel = document.getElementById('fab-s'+i+'-civil');
    if(!civilSel || !civilSel.value) erros.push('Estado civil do sócio '+i+' (pergunta 9)');
    else if(civilSel.value!=='Solteiro(a)'){
      var regimeSel = document.getElementById('fab-s'+i+'-regime');
      if(!regimeSel || !regimeSel.value) erros.push('Regime de casamento do sócio '+i+' (pergunta 9)');
    }
  }

  reqRadio('fab-q10', 'Natureza jurídica (pergunta 10)');
  reqRadio('fab-q11', 'Enquadramento da empresa (pergunta 11)');
  reqRadio('fab-q12', 'Opção pelo Simples Nacional (pergunta 12)');

  var cienteContato = document.getElementById('fab-q13-ciente');
  if(!cienteContato || !cienteContato.checked) erros.push('Confirmação "Estou ciente!" sobre o telefone e e-mail do cartão CNPJ (pergunta 13)');

  var ciente = document.getElementById('fab-q15-ciente');
  if(!ciente || !ciente.checked) erros.push('Confirmação "Estou ciente!" do serviço prestado (pergunta 15)');

  var cienteUrgencia = document.getElementById('fab-urgencia-ciente');
  if(!cienteUrgencia || !cienteUrgencia.checked) erros.push('Confirmação "Estou ciente!" sobre taxa de urgência e cancelamento');

  return erros;
}

async function enviarSolicitacaoAbertura(variant){
  variant = variant || 'abertura';
  var isTransf = variant === 'transformacao';
  var erros = fabValidar(variant);
  var errBox = document.getElementById('fab-errors');
  if(erros.length){
    if(errBox){
      errBox.style.display = 'block';
      errBox.innerHTML = '<strong>Antes de enviar, complete os campos obrigatórios abaixo:</strong><ul style="margin:.5rem 0 0 1.1rem; padding:0;">'+erros.map(function(e){return '<li>'+esc(e)+'</li>';}).join('')+'</ul>';
      errBox.scrollIntoView({behavior:'smooth', block:'start'});
    }
    toast('Existem campos obrigatórios pendentes.');
    return;
  }

  var submitBtn = document.getElementById('fab-submit-btn');
  if(submitBtn) submitBtn.disabled = true;
  toast('Enviando arquivos...');

  var u = currentUser();
  var q2radio = document.querySelector('input[name="fab-q2"]:checked');
  var q3radio = document.querySelector('input[name="fab-q3"]:checked');
  var iptuModo = document.querySelector('input[name="fab-q3-iptu-modo"]:checked');
  var q10radio = document.querySelector('input[name="fab-q10"]:checked');
  var q11radio = document.querySelector('input[name="fab-q11"]:checked');
  var q12radio = document.querySelector('input[name="fab-q12"]:checked');
  var isProprio = q3radio.value==='proprio';
  var servicoId = isTransf ? 'transformacao-mei-me' : 'abertura-cnpj';
  var id = 'p'+Date.now();

  var dados;
  try{
    dados = {
      nomeCompleto: document.getElementById('fab-q1-nome').value.trim(),
      outrosSocios: q2radio.value==='sim',
      qtdSocios: fabNumSocios(),
      enderecoFiscalLucralize: q3radio.value==='lucralize',
      enderecoProprio: isProprio ? document.getElementById('fab-q3-endereco').value.trim() : '',
      iptuModo: isProprio && iptuModo ? iptuModo.value : '',

    '<div style="display:flex; align-items:center; justify-content:space-between; gap:.8rem; flex-wrap:wrap;">'+

        (d.razaoSocialAtual ? '<div class="info-block"><span class="lbl">Razão Social (nome empresarial) - ATUAL</span><span class="val">'+esc(d.razaoSocialAtual)+'</span></div>' : '')+

function altValidar(servicoId){
  var erros = [];
  var isComplexa = servicoId === 'alteracao-complexa';
  function req(id, label){
    var el = document.getElementById(id);
    if(!el || !el.value || !el.value.trim()) erros.push(label);
  }
  function reqFile(id, label){
    var el = document.getElementById(id);
    if(!el || !el.files || !el.files[0]) erros.push(label);
  }

  req('alt-q1-nome', 'Nome completo (pergunta 1)');

  if(isComplexa){
    req('alt-origem-estado', 'UF de origem');
    req('alt-destino-estado', 'UF de destino');
    req('alt-destino-municipio', 'Município de destino');
  }

  var endereco = !!(document.getElementById('alt-tipo-endereco')||{}).checked;
  var quadro = !!(document.getElementById('alt-tipo-quadro')||{}).checked;
  var atividades = !!(document.getElementById('alt-tipo-atividades')||{}).checked;
  var capital = !!(document.getElementById('alt-tipo-capital')||{}).checked;
  var nome = !!(document.getElementById('alt-tipo-nome')||{}).checked;

  if(!(endereco||quadro||atividades||capital||nome)){
    erros.push('Selecione ao menos um tipo de Alteração Contratual');
  }

  if(endereco){
    req('alt-endereco-novo', 'Novo endereço completo (Endereço)');
  }
  if(atividades){
    req('alt-ativ-principal', 'Atividade principal (Atividades Econômicas)');
  }
  if(endereco || atividades){
    var localRadioV = document.querySelector('input[name="alt-local"]:checked');
    if(!localRadioV) erros.push('Confirmação se a atividade é presencial ou apenas fiscal');
    else if(localRadioV.value==='presencial') req('alt-local-atividade', 'Especificação da(s) atividade(s) presencial(is)');
    req('alt-iptu-area', 'Área a ser utilizada pela empresa em m²');
  }
  if(endereco || atividades || nome){
    var iptuModo = document.querySelector('input[name="alt-iptu-modo"]:checked');
    if(!iptuModo) erros.push('Guia de IPTU ou índice cadastral');
    else if(iptuModo.value==='upload') reqFile('alt-iptu-file', 'Upload da guia de IPTU');
    else req('alt-iptu-texto', 'Índice cadastral do IPTU');
  }
  if(quadro){
    req('alt-quadro-capital', 'Divisão do quadro societário após a alteração');
  }
  if(capital){
    req('alt-capital-novo-valor', 'Novo valor do capital social');
    req('alt-capital-percentual', 'Divisão percentual do novo capital social');
  }
  if(quadro || capital){
    var n = altNumSocios();
    for(var i=1;i<=n;i++){
      req('fab-s'+i+'-nome', 'Nome completo do sócio '+i);
      req('fab-s'+i+'-titulo', 'Título de eleitor do sócio '+i);
      req('fab-s'+i+'-endereco', 'Endereço completo do sócio '+i);
      reqFile('fab-s'+i+'-foto', 'Documento de identificação com foto do sócio '+i);
      var irModo = document.querySelector('input[name="fab-s'+i+'-ir-modo"]:checked');
      if(irModo){
        if(irModo.value==='arquivo'){
          reqFile('fab-s'+i+'-ir-2025', 'Upload do recibo de IR 2025 do sócio '+i);
          reqFile('fab-s'+i+'-ir-2026', 'Upload do recibo de IR 2026 do sócio '+i);
        } else {
          req('fab-s'+i+'-ir-numero-2025', 'Número da declaração de IR 2025 do sócio '+i);
          req('fab-s'+i+'-ir-numero-2026', 'Número da declaração de IR 2026 do sócio '+i);
        }
      }
      var civilSel = document.getElementById('fab-s'+i+'-civil');
      if(!civilSel || !civilSel.value) erros.push('Estado civil do sócio '+i);
      else if(civilSel.value!=='Solteiro(a)'){
        var regimeSel = document.getElementById('fab-s'+i+'-regime');
        if(!regimeSel || !regimeSel.value) erros.push('Regime de casamento do sócio '+i);
      }
    }
  }
  if(nome){
    req('alt-nome-razao', 'Razão social desejada (Nome Empresarial)');
    var fantasiaChk = document.getElementById('alt-nome-fantasia-chk');
    if(fantasiaChk && fantasiaChk.checked) req('alt-nome-fantasia-novo', 'Novo nome fantasia (Nome Empresarial)');
  }

  var ciente = document.getElementById('alt-q-ciente');
  if(!ciente || !ciente.checked) erros.push('Confirmação "Estou ciente!" do serviço prestado');

  var cienteUrgencia = document.getElementById('alt-urgencia-ciente');
  if(!cienteUrgencia || !cienteUrgencia.checked) erros.push('Confirmação "Estou ciente!" sobre taxa de urgência e cancelamento');

  return erros;
}

async function enviarSolicitacaoAlteracao(servicoId){
  var erros = altValidar(servicoId);
  var errBox = document.getElementById('alt-errors');
  if(erros.length){
    if(errBox){
      errBox.style.display = 'block';
      errBox.innerHTML = '<strong>Antes de enviar, complete os campos obrigatórios abaixo:</strong><ul style="margin:.5rem 0 0 1.1rem; padding:0;">'+erros.map(function(e){return '<li>'+esc(e)+'</li>';}).join('')+'</ul>';
      errBox.scrollIntoView({behavior:'smooth', block:'start'});
    }
    toast('Existem campos obrigatórios pendentes.');
    return;
  }

  var submitBtn = document.getElementById('alt-submit-btn');
  if(submitBtn) submitBtn.disabled = true;
  toast('Enviando arquivos...');

  var u = currentUser();
  var s = SERVICE_MAP[servicoId];
  var isComplexa = servicoId === 'alteracao-complexa';
  var endereco = !!(document.getElementById('alt-tipo-endereco')||{}).checked;
  var quadro = !!(document.getElementById('alt-tipo-quadro')||{}).checked;
  var atividades = !!(document.getElementById('alt-tipo-atividades')||{}).checked;
  var capital = !!(document.getElementById('alt-tipo-capital')||{}).checked;
  var nome = !!(document.getElementById('alt-tipo-nome')||{}).checked;
  var localRadio = document.querySelector('input[name="alt-local"]:checked');
  var iptuModo = document.querySelector('input[name="alt-iptu-modo"]:checked');
  var fantasiaChk = document.getElementById('alt-nome-fantasia-chk');
  var id = 'p'+Date.now();

  var tiposLabels = [];
  if(endereco) tiposLabels.push('Endereço');
  if(quadro) tiposLabels.push('Quadro Societário');
  if(atividades) tiposLabels.push('Atividades Econômicas');
  if(capital) tiposLabels.push('Capital Social');
  if(nome) tiposLabels.push('Nome Empresarial');

  var dados;
  try{
  dados = {
    nomeCompleto: document.getElementById('alt-q1-nome').value.trim(),
    origemEstado: isComplexa ? document.getElementById('alt-origem-estado').value.trim() : '',
    destinoEstado: isComplexa ? document.getElementById('alt-destino-estado').value.trim() : '',
    destinoMunicipio: isComplexa ? document.getElementById('alt-destino-municipio').value.trim() : '',
    tipos: tiposLabels,
    endereco: endereco ? { novoEndereco: document.getElementById('alt-endereco-novo').value.trim() } : null,
    atividades: atividades ? {
      principalResultante: document.getElementById('alt-ativ-principal').value.trim(),
      secundariasResultantes: document.getElementById('alt-ativ-secundarias').value.trim()
    } : null,
    localConfirmacao: (endereco||atividades) && localRadio ? localRadio.value : '',
    localAtividade: (endereco||atividades) && localRadio && localRadio.value==='presencial' ? document.getElementById('alt-local-atividade').value.trim() : '',
    iptuModo: (endereco||atividades||nome) && iptuModo ? iptuModo.value : '',
    iptuIndice: (endereco||atividades||nome) && iptuModo && iptuModo.value==='texto' ? document.getElementById('alt-iptu-texto').value.trim() : '',
    iptuArquivo: (endereco||atividades||nome) && iptuModo && iptuModo.value==='upload' ? await fabArquivoReal('alt-iptu-file', id, 'iptu') : null,
    iptuArea: (endereco||atividades) ? document.getElementById('alt-iptu-area').value.trim() : '',
    quadroDivisao: quadro ? document.getElementById('alt-quadro-capital').value.trim() : '',
    capitalNovoValor: capital ? document.getElementById('alt-capital-novo-valor').value.trim() : '',
    capitalPercentual: capital ? document.getElementById('alt-capital-percentual').value.trim() : '',
    socios: (quadro||capital) ? await fabColetarSociosReal(id) : [],
    razaoSocialDesejada: nome ? document.getElementById('alt-nome-razao').value.trim() : '',
    alterarNomeFantasia: (nome && fantasiaChk) ? fantasiaChk.checked : false,
    nomeFantasiaNovo: (nome && fantasiaChk && fantasiaChk.checked) ? document.getElementById('alt-nome-fantasia-novo').value.trim() : '',
    cienteServico: true
  };
  }catch(e){
    console.error(e);
    if(submitBtn) submitBtn.disabled = false;
    toast('Não foi possível enviar um ou mais arquivos. Tente novamente.');
    return;
  }

  var ok = await finalizarNovoProcesso({
    id:id, servicoId:servicoId, status:'aguardando_pagamento', etapaAtual:-1,
    criadoEm: todayISO(), protocolo:'',
    historico:[{data:todayISO(), hora:nowHM(), texto:'Formulário de '+s.nome+' preenchido e enviado pelo cliente. Aguardando envio do boleto.', autor:'cliente'}],
    documentosAndamento:[], documentosFinais:[],
    formularioAlteracao: dados
  });
  if(!ok && submitBtn) submitBtn.disabled = false;
}

function baxValidar(){
  var erros = [];
  function req(id, label){
    var el = document.getElementById(id);
    if(!el || !el.value || !el.value.trim()) erros.push(label);
  }
  function reqFile(id, label){
    var el = document.getElementById(id);
    if(!el || !el.files || !el.files[0]) erros.push(label);
  }

  var q1radio = document.querySelector('input[name="bax-q1-pendencias"]:checked');
  if(!q1radio){ erros.push('Se o CNPJ possui pendências em aberto (pergunta 1)'); return erros; }

  if(q1radio.value==='nao'){
    /* certidões (Federal, Estadual e Municipal): não obrigatórias quando o CNPJ está regular */
  } else {
    var algumParcelamento = false;
    ['federal','municipal','estadual'].forEach(function(esfera){
      var radio = document.querySelector('input[name="bax-parc-'+esfera+'-tem"]:checked');
      if(radio && radio.value==='sim'){
        algumParcelamento = true;
        req('bax-parc-'+esfera+'-qtd', 'Quantidade de parcelamentos ativos ('+esfera+')');
        req('bax-parc-'+esfera+'-situacao', 'Situação do pagamento do parcelamento ('+esfera+')');
      }
    });
    if(algumParcelamento){
      var parcCiente = document.getElementById('bax-parc-ciente');
      if(!parcCiente || !parcCiente.checked) erros.push('Confirmação "Estou ciente!" sobre a continuidade dos pagamentos das parcelas');
    }
    var regularizarRadio = document.querySelector('input[name="bax-regularizar"]:checked');
    if(!regularizarRadio) erros.push('Se as pendências serão regularizadas antes da baixa ou não');
    else if(regularizarRadio.value==='sem_regularizar'){
      var regularizarCiente = document.getElementById('bax-regularizar-ciente');
      if(!regularizarCiente || !regularizarCiente.checked) erros.push('Confirmação "Estou ciente!" sobre débitos direcionados ao CPF do responsável');
    }
  }

  var finalCiente = document.getElementById('bax-final-ciente');
  if(!finalCiente || !finalCiente.checked) erros.push('Confirmação "Estou ciente!" das obrigações do último mês e do honorário da última competência');

  return erros;
}

async function enviarSolicitacaoBaixa(){
  var erros = baxValidar();
  var errBox = document.getElementById('bax-errors');
  if(erros.length){
    if(errBox){
      errBox.style.display = 'block';
      errBox.innerHTML = '<strong>Antes de enviar, complete os campos obrigatórios abaixo:</strong><ul style="margin:.5rem 0 0 1.1rem; padding:0;">'+erros.map(function(e){return '<li>'+esc(e)+'</li>';}).join('')+'</ul>';
      errBox.scrollIntoView({behavior:'smooth', block:'start'});
    }
    toast('Existem campos obrigatórios pendentes.');
    return;
  }

  var submitBtn = document.getElementById('bax-submit-btn');
  if(submitBtn) submitBtn.disabled = true;
  toast('Enviando arquivos...');

  var u = currentUser();
  var s = SERVICE_MAP['baixa-cnpj'];
  var q1radio = document.querySelector('input[name="bax-q1-pendencias"]:checked');
  var temPendencias = q1radio.value==='sim';
  var estadualNA = document.getElementById('bax-cert-estadual-na');
  var id = 'p'+Date.now();

  var parcelamentos = {};
  ['federal','municipal','estadual'].forEach(function(esfera){
    var radio = document.querySelector('input[name="bax-parc-'+esfera+'-tem"]:checked');
    if(radio && radio.value==='sim'){
      parcelamentos[esfera] = {
        qtd: document.getElementById('bax-parc-'+esfera+'-qtd').value.trim(),
        situacao: document.getElementById('bax-parc-'+esfera+'-situacao').value
      };
    }
  });
  var regularizarRadio = document.querySelector('input[name="bax-regularizar"]:checked');

  var dados;
  try{
    dados = {
      temPendencias: temPendencias,
      certidaoFederalArquivo: !temPendencias ? await fabArquivoReal('bax-cert-federal', id, 'certidao-federal') : null,
      estadualNaoAplica: !temPendencias ? !!(estadualNA && estadualNA.checked) : false,
      certidaoEstadualArquivo: (!temPendencias && !(estadualNA && estadualNA.checked)) ? await fabArquivoReal('bax-cert-estadual', id, 'certidao-estadual') : null,
      certidaoMunicipalArquivo: !temPendencias ? await fabArquivoReal('bax-cert-municipal', id, 'certidao-municipal') : null,
      relatorioFiscalArquivo: !temPendencias ? await fabArquivoReal('bax-relatorio-fiscal', id, 'relatorio-fiscal') : null,
      parcelamentos: parcelamentos,
      regularizacaoOpcao: temPendencias && regularizarRadio ? regularizarRadio.value : '',
      cienteServico: true
    };
  }catch(e){
    console.error(e);
    if(submitBtn) submitBtn.disabled = false;
    toast('Não foi possível enviar um ou mais arquivos. Tente novamente.');
    return;
  }

  var ok = await finalizarNovoProcesso({
    id:id, servicoId:'baixa-cnpj', status:'aguardando_pagamento', etapaAtual:-1,
    criadoEm: todayISO(), protocolo:'',
    historico:[{data:todayISO(), hora:nowHM(), texto:'Formulário de '+s.nome+' preenchido e enviado pelo cliente. Aguardando envio do boleto.', autor:'cliente'}],
    documentosAndamento:[], documentosFinais:[],
    formularioBaixa: dados
  });
  if(!ok && submitBtn) submitBtn.disabled = false;
}

        (d.temPendencias ? '<div class="info-block"><span class="lbl">Regularização</span><span class="val">'+esc(regularizacaoLabel)+'</span></div>' : '')+

function repValidar(){
  var erros = [];
  function req(id, label){
    var el = document.getElementById(id);
    if(!el || !el.value || !el.value.trim()) erros.push(label);
  }
  function reqFile(id, label){
    var el = document.getElementById(id);
    if(!el || !el.files || !el.files[0]) erros.push(label);
  }

  var representante = !!(document.getElementById('rep-tipo-representante')||{}).checked;
  var contato = !!(document.getElementById('rep-tipo-contato')||{}).checked;

  if(!representante && !contato){
    erros.push('Selecione ao menos uma opção (Representante Legal e/ou Contato)');
    return erros;
  }

  if(representante){
    reqFile('rep-documento', 'Documento pessoal do novo representante legal');
    var certCiente = document.getElementById('rep-certificado-ciente');
    if(!certCiente || !certCiente.checked) erros.push('Confirmação "Estou ciente!" sobre o novo certificado digital');
  }
  if(contato){
    req('rep-telefone', 'Telefone desejado');
    req('rep-email', 'E-mail desejado');
  }

  return erros;
}

async function enviarSolicitacaoRepresentante(){
  var erros = repValidar();
  var errBox = document.getElementById('rep-errors');
  if(erros.length){
    if(errBox){
      errBox.style.display = 'block';
      errBox.innerHTML = '<strong>Antes de enviar, complete os campos obrigatórios abaixo:</strong><ul style="margin:.5rem 0 0 1.1rem; padding:0;">'+erros.map(function(e){return '<li>'+esc(e)+'</li>';}).join('')+'</ul>';
      errBox.scrollIntoView({behavior:'smooth', block:'start'});
    }
    toast('Existem campos obrigatórios pendentes.');
    return;
  }

  var submitBtn = document.getElementById('rep-submit-btn');
  if(submitBtn) submitBtn.disabled = true;
  toast('Enviando arquivos...');

  var u = currentUser();
  var s = SERVICE_MAP['alteracao-dbe'];
  var representante = !!(document.getElementById('rep-tipo-representante')||{}).checked;
  var contato = !!(document.getElementById('rep-tipo-contato')||{}).checked;
  var id = 'p'+Date.now();

  var dados;
  try{
    dados = {
      representante: representante,
      documentoNovoRepresentante: representante ? await fabArquivoReal('rep-documento', id, 'documento-representante') : null,
      certificadoDigitalCiente: representante,
      contato: contato,
      telefoneDesejado: contato ? document.getElementById('rep-telefone').value.trim() : '',
      emailDesejado: contato ? document.getElementById('rep-email').value.trim() : '',
      cienteServico: true
    };
  }catch(e){
    console.error(e);
    if(submitBtn) submitBtn.disabled = false;
    toast('Não foi possível enviar um ou mais arquivos. Tente novamente.');
    return;
  }

  var ok = await finalizarNovoProcesso({
    id:id, servicoId:'alteracao-dbe', status:'aguardando_pagamento', etapaAtual:-1,
    criadoEm: todayISO(), protocolo:'',
    historico:[{data:todayISO(), hora:nowHM(), texto:'Formulário de '+s.nome+' preenchido e enviado pelo cliente. Aguardando envio do boleto.', autor:'cliente'}],
    documentosAndamento:[], documentosFinais:[],
    formularioRepresentante: dados
  });
  if(!ok && submitBtn) submitBtn.disabled = false;
}

async function anexarDocPendente(processId, idx){
  var p = state.processes.filter(function(x){return x.id===processId;})[0];
  var input = document.getElementById('pend-'+processId+'-'+idx);
  if(!p || !input || !input.files || !input.files[0]) return;
  var file = input.files[0];
  toast('Enviando arquivo...');
  try{
    var doc = await uploadArquivoReal(file, processId, 'pendentes');
    var snapshot = JSON.parse(JSON.stringify(p));
    p.solicitacaoDocs[idx].arquivo = file.name;
    p.solicitacaoDocs[idx].path = doc.path;
    p.historico.push({data:todayISO(), hora:nowHM(), texto:'Documento "'+p.solicitacaoDocs[idx].nome+'" anexado pelo cliente: '+file.name+'.', autor:'cliente'});
    saveState();
    render();
    var ok = await salvarProcessoNoServidor(p);
    if(ok){
      toast('Documento anexado!');
    } else {
      Object.assign(p, snapshot);
      saveState();
      render();
      toast('O arquivo foi enviado, mas não foi possível atualizar o processo. Tente novamente.');
    }
  }catch(e){
    console.error(e);
    toast(e && e.amigavel ? e.message : 'Não foi possível enviar o arquivo. Tente novamente.');
  }
}

/* ---------- Detalhe do processo (cliente e admin) ---------- */
function renderProcessoDetalhe(id, adminMode, publicMode){
  var p = state.processes.filter(function(x){return x.id===id;})[0];
  if(!p) return '<div class="empty-state">Processo não encontrado.</div>';
  var s = SERVICE_MAP[p.servicoId];
  if(!s) return '<div class="empty-state">Este processo referencia um serviço não identificado ('+esc(p.servicoId||'—')+'). Entre em contato com o suporte técnico da Lucralize para corrigir este registro.</div>';
  var company = getCompany(p.empresaId);
  var steps = stepStates(p, s);

  var fullSteps = passosParaCliente(p);   /* mesma lista que o cliente vê na consulta */

  var stepperHtml = fullSteps.map(function(st, i){
    var node = st.state==='concluida' ? '✓' : (i+1);
    return '<div class="step '+st.state+'">'+
      '<div class="rail"><div class="node">'+node+'</div><div class="line"></div></div>'+
      '<div class="step-body"><div class="title">'+esc(st.label)+'</div>'+
        (st.state==='atual' ? '<div class="when">Em andamento agora</div>' : '')+
      '</div>'+
    '</div>';
  }).join('');

  /* Itens de controle interno (ex.: Licenciamento e Alvará numa Alteração
     Contratual, ou Portal Nacional/Acesso à Prefeitura numa abertura) —
     nunca aparecem pro cliente, só na visão da equipe, e podem ser marcados
     independente da etapa/status do processo. */

  var itensInternosHtml = itensInternos.length ? (''+
    '<div class="card" style="padding:1.1rem 1.2rem; display:flex; flex-direction:column; gap:.6rem;">'+
      '<span class="eyebrow">Controle interno — não aparece para o cliente</span>'+
      itensInternos.map(function(item){
        var marcado = !!(p.itensInternos && p.itensInternos[item]);
        return '<label class="radio-option" style="align-items:center;"><input type="checkbox"'+(marcado?' checked':'')+' onchange="PS.toggleItemInterno(\''+p.id+'\', \''+esc(item)+'\')"> '+esc(item)+'</label>';
      }).join('')+
    '</div>') : '';

  var histHtml = p.historico.slice().reverse().map(function(h){
    var ehObservacao = h.tipo==='observacao_cliente';
    return '<div style="display:flex; gap:.8rem; font-size:.84rem;">'+
      '<span class="mono" style="color:var(--ink-faint); flex:none; width:118px;">'+fmtDate(h.data)+' '+esc(h.hora||'')+'</span>'+
      '<span style="flex:1;'+(ehObservacao?' color:var(--danger); font-weight:700;':'')+'">'+esc(h.texto)+'<span style="display:block; font-size:.72rem; font-weight:600; color:'+(ehObservacao?'var(--danger)':'var(--ink-faint)')+'; margin-top:.1rem;">Atualizado por: '+autorLabel(h.autor)+'</span></span>'+
    '</div>';
  }).join('<div style="height:.55rem;"></div>');

  function fileRows(list, categoria){
    return list.length ? list.map(function(d, i){
      var btn = d.path
        ? '<button class="btn btn-subtle btn-sm" onclick="PS.baixarArquivoReal(\''+esc(d.path)+'\')">Baixar</button>'
        : '<button class="btn btn-subtle btn-sm" disabled title="Arquivo original não disponível para download">Baixar</button>';
      var excluirBtn = (adminMode && categoria) ? '<button class="btn btn-danger btn-sm" onclick="PS.abrirModalExcluirArquivo(\''+p.id+'\',\''+categoria+'\','+i+',\''+esc(d.path||'')+'\')">Excluir</button>' : '';
      return '<div class="file-row"><span class="ic">📄</span><span class="name">'+esc(d.nome)+'</span>'+btn+excluirBtn+'</div>';
    }).join('') : '';
  }
  var docsFinaisHtml = fileRows(p.documentosFinais, 'finais') || '<p style="font-size:.84rem; color:var(--ink-faint);">Os documentos finais ficarão disponíveis aqui assim que o processo for concluído.</p>';
  var docsAndamentoHtml = fileRows(p.documentosAndamento, 'andamento') || '<p style="font-size:.84rem; color:var(--ink-faint);">Nenhum documento de andamento anexado ainda.</p>';

  var solicitacaoHtml = renderSolicitacaoBlock(p, !adminMode);
  var formularioHtml = p.formularioAbertura ? renderFormularioAberturaResumo(p) : (p.formularioAlteracao ? renderFormularioAlteracaoResumo(p) : (p.formularioBaixa ? renderFormularioBaixaResumo(p) : (p.formularioAlvara ? renderFormularioAlvaraResumo(p) : (p.formularioRepresentante ? renderFormularioRepresentanteResumo(p) : (p.formularioManual ? renderFormularioManualResumo(p) : '')))));

  var protocoloCard = adminMode ? (''+
    '<div class="card" style="padding:1.1rem 1.2rem; display:flex; flex-direction:column; gap:.6rem;">'+
      '<span class="eyebrow">Protocolo do processo</span>'+
      '<div style="display:flex; gap:.5rem;">'+
        '<input type="text" id="protocolo-input-'+p.id+'" value="'+esc(p.protocolo||'')+'" placeholder="Ex.: JCM-2026-000000" class="mono" style="flex:1; min-width:0; padding:.55rem .7rem; border-radius:8px; border:1px solid var(--border); background:var(--surface); color:var(--ink); font-size:.85rem;">'+

function proximaEtapaLabel(p){
  var etapas = etapasDoProcesso(p);
  if(p.status==='aguardando_pagamento') return etapas[0];
  if(p.etapaAtual < etapas.length-1) return etapas[p.etapaAtual+1];
  return null;
}
function etapaExigePendencias(label){
  return !!label && label.toLowerCase().indexOf('recebimento de informações')!==-1;
}
function avancarEtapa(id){
  var p = state.processes.filter(function(x){return x.id===id;})[0];
  var proxLabel = proximaEtapaLabel(p);
  if(etapaExigePendencias(proxLabel)){ abrirModalComplemento(id); return; }
  executarAvancoEtapa(id, null);
}
async function executarAvancoEtapa(id, pendenciasTexto){
  var p = state.processes.filter(function(x){return x.id===id;})[0];
  var etapas = etapasDoProcesso(p);
  var snapshot = JSON.parse(JSON.stringify(p));
  var sufixoPendencias = pendenciasTexto ? ' Informações pendentes: '+pendenciasTexto : '';
  if(p.status==='aguardando_pagamento'){
    p.status='em_andamento'; p.etapaAtual=0;
    p.historico.push({data:todayISO(), hora:nowHM(), texto:'Pagamento confirmado. Processo iniciado — '+etapas[0]+'.'+sufixoPendencias, autor:nomeAutorAtual()});
  } else if(p.etapaAtual < etapas.length-1){
    /* Ainda existe mais de uma etapa nomeada pela frente: só avança o marcador,
       sem concluir nada — mesmo que a PRÓXIMA etapa seja a última da linha do
       tempo. A última etapa precisa aparecer "Em andamento agora" para o
       cliente antes de ser marcada como concluída (ver bloco abaixo). */
    p.etapaAtual++;
    p.historico.push({data:todayISO(), hora:nowHM(), texto: etapas[p.etapaAtual]+'.'+sufixoPendencias, autor:nomeAutorAtual()});
  } else if(p.etapaAtual===etapas.length-1 && p.status!=='concluido'){
    /* Já estava na última etapa da linha do tempo, "em andamento" — esta é a
       ação explícita que efetivamente conclui essa etapa e o processo. Chegar
       nesta última etapa NUNCA conclui sozinho (bloco acima); só este clique a
       mais, feito deliberadamente pela equipe, conclui. */
    p.status='concluido';
    p.historico.push({data:todayISO(), hora:nowHM(), texto: etapas[p.etapaAtual]+' concluído. Processo concluído! 🎉'+sufixoPendencias, autor:nomeAutorAtual()});
    /* Antes, se a equipe não tivesse anexado o documento final de verdade,
       o sistema criava aqui um item fictício ("... - Documento Final.pdf")
       sem nenhum arquivo real por trás — ele aparecia na tela do cliente como
       se fosse baixável, mas o download sempre falhava, pois não existe path
       nenhum associado. Removido: agora, sem anexo real, o cliente vê a
       mensagem "os documentos finais ficarão disponíveis aqui" normalmente,
       em vez de um link quebrado. */
  }
  prepararEmailDaEtapa(p, p.status==='concluido' ? 'concluido' : 'etapa', etapas[p.etapaAtual]);
  saveState();
  closePanel();
  render();
  var ok = await salvarProcessoNoServidor(p);
  if(ok){
    toast('Etapa atualizada — o cliente já vê a atualização no portal dele.' + (emailDoCliente(p) ? ' O e-mail ao cliente foi solicitado.' : ' Este processo não tem e-mail do cliente: nenhum e-mail será enviado.'));
    dispararEmail(p);
  } else {
    Object.assign(p, snapshot);
    saveState();
    render();
    toast('Não foi possível atualizar a etapa. Verifique sua internet e tente novamente.');
  }
}

async function confirmarReiniciarProcesso(id){
  var p = state.processes.filter(function(x){return x.id===id;})[0];
  var radio = document.querySelector('input[name="reiniciar-etapa"]:checked');
  var errBox = document.getElementById('reiniciar-erro');
  if(!radio){
    if(errBox){ errBox.textContent = 'Selecione para qual etapa o processo deve voltar.'; errBox.style.display='block'; }
    return;
  }
  var snapshot = JSON.parse(JSON.stringify(p));
  var idx = parseInt(radio.value, 10);
  var statusAnterior = p.status;
  if(idx===-1){
    p.status='aguardando_pagamento'; p.etapaAtual=-1;
  } else {
    p.status='em_andamento'; p.etapaAtual=idx;
  }
  if(p.vistoriaNaoNecessaria && idx <= etapasDoProcesso(p).indexOf(ETAPA_VISTORIA)) p.vistoriaNaoNecessaria = false;   /* voltou para antes da vistoria: ela volta a ser avaliada */
  var label = idx===-1 ? 'Pagamento confirmado' : etapasDoProcesso(p)[idx];
  p.historico.push({data:todayISO(), hora:nowHM(), texto:'Processo reiniciado manualmente pela equipe Lucralize para a etapa: '+label+'.'+(statusAnterior!==p.status?' (status anterior: '+statusLabel(statusAnterior)+')':''), autor:nomeAutorAtual()});
  saveState();
  closePanel();
  render();
  var ok = await salvarProcessoNoServidor(p);
  if(ok){
    toast('Processo reiniciado para: '+label+'.');
  } else {
    Object.assign(p, snapshot);
    saveState();
    render();
    toast('Não foi possível reiniciar o processo. Verifique sua internet e tente novamente.');
  }
}
async function anexarDocumento(id, categoria){
  var p = state.processes.filter(function(x){return x.id===id;})[0];
  var input = document.getElementById('anexo-'+categoria+'-'+id);
  if(!p || !input || !input.files || !input.files[0]) return;
  var file = input.files[0];
  var campo = categoria==='andamento' ? 'documentosAndamento' : 'documentosFinais';
  var subpasta = categoria==='andamento' ? 'andamento' : 'finais';
  toast('Enviando arquivo...');
  try{
    var doc = await uploadArquivoReal(file, id, subpasta);
    var snapshot = JSON.parse(JSON.stringify(p));
    p[campo].push(doc);
    saveState(); render();
    var ok = await salvarProcessoNoServidor(p);
    if(ok){
      toast('Documento '+(categoria==='andamento'?'de andamento':'final')+' anexado.');
    } else {
      Object.assign(p, snapshot);
      saveState();
      render();
      toast('O arquivo foi enviado, mas não foi possível atualizar o processo. Tente novamente.');
    }
  }catch(e){
    console.error(e);
    toast(e && e.amigavel ? e.message : 'Não foi possível enviar o arquivo. Tente novamente.');
  }
}

      if(!res.data || !res.data.length) throw new Error('Nenhum processo excluído (0 linhas afetadas — verifique permissões).');

async function confirmarExcluirProcesso(id){
  var p = state.processes.filter(function(x){return x.id===id;})[0];
  if(!p) return;
  var textarea = document.getElementById('excluir-justificativa');
  var justificativa = textarea ? textarea.value.trim() : '';
  var errBox = document.getElementById('excluir-erro');
  var ehTeste = !!(document.getElementById('excluir-e-teste') && document.getElementById('excluir-e-teste').checked);
  if(!ehTeste && !justificativa){ if(errBox){ errBox.textContent='Descreva a justificativa da exclusão antes de continuar.'; errBox.style.display='block'; } return; }
  var btn = document.getElementById('excluir-confirmar-btn');
  if(btn){ btn.disabled = true; btn.textContent = 'Excluindo…'; }

  var ok = await excluirProcessoNoServidor(id);
  if(!ok){
    if(btn){ btn.disabled = false; btn.textContent = 'Excluir processo'; }
    if(errBox){ errBox.textContent='Não foi possível excluir o processo agora. Verifique sua internet e tente novamente.'; errBox.style.display='block'; }
    return;
  }

  if(!ehTeste){
    var autor = currentUser();
    var s = SERVICE_MAP[p.servicoId] || {nome:'Serviço não identificado'};
    if(!state.processosExcluidos) state.processosExcluidos = [];
    state.processosExcluidos.push({
      id:'x'+Date.now(),
      servicoNome:s.nome,
      empresaNome:nomeParaProcesso(p),
      ordemServico:p.ordemServico||null,
      justificativa:justificativa,
      excluidoPor: autor ? autor.nome : '—',
      data:todayISO(),
      hora:nowHM()
    });
  }
  state.processes = state.processes.filter(function(x){return x.id!==id;});
  saveState();
  closePanel();
  go({name:(p.status==='solicitado' || p.status==='recusado') ? 'admin-solicitacoes' : 'admin-processos'});

  if(ehTeste && p.ordemServico){
    var liberou = await liberarNumeroOS(p.ordemServico);

async function confirmarIncluirProcessoManual(){
  var empresaSel = document.getElementById('manual-empresa').value;
  var servicoId = document.getElementById('manual-servico').value;
  var etapaVal = document.getElementById('manual-etapa').value;
  var dataAbertura = document.getElementById('manual-data').value || todayISO();
  var errBox = document.getElementById('manual-erro');

  var empresaId;
  if(empresaSel==='__nova__'){
    var nome = document.getElementById('manual-empresa-nome').value.trim();
    if(!nome){ if(errBox){errBox.textContent='Informe a razão social da nova empresa.'; errBox.style.display='block';} return; }
    var cnpj = document.getElementById('manual-empresa-cnpj').value.trim();
    var tipo = document.getElementById('manual-empresa-tipo').value.trim() || 'LTDA';
    var divisaoNova = document.getElementById('manual-empresa-divisao').value;
    empresaId = 'c'+Date.now();
    var empresaNovaManual = {id:empresaId, nome:nome, cnpj:cnpj||'—', tipo:tipo, divisao:divisaoNova};
    /* A empresa precisa estar gravada na planilha ANTES do processo: o processo guarda
       empresa_id como referência a ela, e sem essa gravação ela só existiria na
       memória do navegador e sumiria ao recarregar a página. */
    var insEmpresaManual = await planilha.from('empresas').insert(empresaParaRow(empresaNovaManual));
    if(insEmpresaManual.error){
      if(errBox){ errBox.textContent='Não foi possível criar a empresa: '+insEmpresaManual.error.message; errBox.style.display='block'; }
      return;
    }
    state.companies.push(empresaNovaManual);
  } else {
    empresaId = empresaSel;
  }

  var status, etapaAtual;
  if(etapaVal==='aguardando_pagamento'){ status='aguardando_pagamento'; etapaAtual=-1; }
  else if(etapaVal==='concluido'){ status='concluido'; etapaAtual=etapasBaseParaServico(servicoId).length-1; }
  else { status='em_andamento'; etapaAtual=parseInt(etapaVal,10); }

  var id = 'p'+Date.now();
  var arquivo;
  try{
    arquivo = await fabArquivoReal('manual-formulario', id, 'andamento');
  }catch(e){
    console.error(e);
    toast(e && e.amigavel ? e.message : 'Não foi possível enviar o arquivo. Tente novamente.');
    return;
  }

  var empresaObj = getCompany(empresaId);
  var processo = {
    id:id, servicoId:servicoId, status:status, etapaAtual:etapaAtual,
    criadoEm: dataAbertura, protocolo:'',
    historico:[{data:dataAbertura, hora:nowHM(), texto:'Processo incluído manualmente pela equipe Lucralize a partir de um registro anterior a este portal.'+(arquivo?' Documento original anexado: '+arquivo.nome+'.':''), autor:nomeAutorAtual()}],
    documentosAndamento: arquivo ? [arquivo] : [],
    documentosFinais: [], /* sem arquivo real anexado ainda não vira item fictício não-baixável — ver nota em executarAvancoEtapa */
    formularioManual: {arquivo:arquivo||null},
    empresaId: empresaId,
    divisao: empresaObj ? (empresaObj.divisao || null) : null,
    ordemServico: await gerarOrdemServico(),
    codigoAcompanhamento: gerarCodigoAcompanhamento()
  };

  var salvo = await salvarProcessoNoServidor(processo);
  if(!salvo){
    toast('Não foi possível salvar o processo. Verifique sua internet e tente novamente.');
    return;
  }
  state.processes.push(processo);
  saveState();
  closePanel();
  render();
  toast('Processo incluído manualmente — '+processo.ordemServico+'.');
}

async function salvarEdicaoUsuario(id){
  var u = getUser(id);
  if(!u) return;
  var nome = ((document.getElementById('eu-nome')||{}).value || '').trim();
  var telefone = ((document.getElementById('eu-telefone')||{}).value || '').trim();
  var novoRole = (document.querySelector('input[name="eu-tipo-acesso"]:checked')||{}).value || u.role;
  var errBox = document.getElementById('eu-erro');
  if(!nome){ if(errBox){ errBox.textContent='Preencha o nome completo.'; errBox.style.display='block'; } return; }
  if(novoRole==='cliente'){
    var selEl = document.getElementById('eu-empresa-select');
    if(!selEl || !selEl.value){ if(errBox){ errBox.textContent='Selecione a empresa vinculada a este cliente.'; errBox.style.display='block'; } return; }
  }
  var btn = document.getElementById('eu-salvar-btn');
  if(btn) btn.disabled = true;

  var snapshotUsuario = JSON.parse(JSON.stringify(u));
  u.nome = nome;
  /* o telefone não é mais pedido: o que já estiver cadastrado fica como está */
  u.role = novoRole;
  if(novoRole!=='admin') u.principal = false;

  var c = null, snapshotEmpresa = null;
  if(novoRole==='cliente'){
    var empresaSelecionadaId = (document.getElementById('eu-empresa-select')||{}).value;
    u.empresaId = empresaSelecionadaId;
    c = getCompany(empresaSelecionadaId);
    snapshotEmpresa = c ? JSON.parse(JSON.stringify(c)) : null;
    if(c){
      var empresaEl = document.getElementById('eu-empresa');
      var cnpjEl = document.getElementById('eu-cnpj');
      var tipoEl = document.getElementById('eu-tipo');
      if(empresaEl && empresaEl.value.trim()) c.nome = empresaEl.value.trim();
      if(cnpjEl && cnpjEl.value.trim()) c.cnpj = cnpjEl.value.trim();
      if(tipoEl && tipoEl.value.trim()) c.tipo = tipoEl.value.trim();
    }
  } else {
    u.empresaId = null;
  }

  saveState();
  render();

  var resUsuario = await planilha.from('usuarios').update(usuarioParaRow(u)).eq('id', u.id);
  var resEmpresa = c ? await planilha.from('empresas').update(empresaParaRow(c)).eq('id', c.id) : {error:null};

  if(!resUsuario.error && !resEmpresa.error){
    closePanel();
    toast('Cadastro atualizado.');
  } else {
    Object.assign(u, snapshotUsuario);
    if(c && snapshotEmpresa) Object.assign(c, snapshotEmpresa);
    saveState();
    render();
    toast('Não foi possível salvar as alterações. Verifique sua internet e tente novamente.');
  }
}

async function confirmarExcluirArquivo(id, categoria, idx, path){
  var p = state.processes.filter(function(x){return x.id===id;})[0];
  if(!p){ closePanel(); return; }
  var campo = categoria==='andamento' ? 'documentosAndamento' : 'documentosFinais';
  var lista = p[campo] || [];
  var pos = -1;
  if(lista[idx] && (lista[idx].path||'')===(path||'')) pos = idx;
  else if(path){ for(var i=0;i<lista.length;i++){ if(lista[i].path===path){ pos = i; break; } } }
  if(pos<0){ closePanel(); render(); toast('Esse arquivo já não está mais no processo.'); return; }
  var snapshot = JSON.parse(JSON.stringify(p));
  var removido = lista.splice(pos, 1)[0];
  /* o arquivo original de um processo incluído manualmente aparece também no bloco "formulário manual" */
  if(removido.path && p.formularioManual && p.formularioManual.arquivo && p.formularioManual.arquivo.path===removido.path){
    p.formularioManual.arquivo = null;
  }
  saveState(); closePanel(); render();
  var ok = await salvarProcessoNoServidor(p);
  if(!ok){
    Object.assign(p, snapshot);
    saveState(); render();
    toast('Não foi possível excluir o arquivo. Verifique sua internet e tente novamente.');
    return;
  }
  /* o processo já não aponta mais para o arquivo; agora apaga o arquivo em si (se falhar, sobra só um arquivo solto) */
  if(removido.path){
    try{
      var r = await planilha.arquivos.remove([removido.path]);
      if(r && r.error) console.warn('Arquivo removido do processo, mas não do SharePoint:', r.error.message);
    }catch(e){ console.warn('Arquivo removido do processo, mas não do SharePoint:', e); }
  }
  toast('Arquivo excluído.');
}

/* =========================================================
   CÓDIGO DE ACOMPANHAMENTO (parte do cliente, etapa 1: lado da equipe)
   Cada processo tem a OS sequencial (interna) e um código aleatório, que é o que o
   cliente usa para consultar o processo sem ter conta. O código fica no próprio
   processo (p.codigoAcompanhamento).
   ========================================================= */
function gerarCodigoAcompanhamento(){
  var usados = {};
  state.processes.forEach(function(p){ if(p.codigoAcompanhamento) usados[p.codigoAcompanhamento] = true; });
  for(var t = 0; t < 10; t++){
    var b = new Uint8Array(6);
    crypto.getRandomValues(b);                                   /* 48 bits aleatórios do navegador */
    var hex = Array.prototype.map.call(b, function(x){ return ('0'+x.toString(16)).slice(-2); }).join('').toUpperCase();
    var c = hex.slice(0,4)+'-'+hex.slice(4,8)+'-'+hex.slice(8,12);
    if(!usados[c]) return c;
  }
  throw new Error('Não foi possível gerar um código de acompanhamento único.');
}
function soAlfaNum(s){ return String(s == null ? '' : s).toLowerCase().replace(/[^a-z0-9]/g, ''); }
/* busca da lista: empresa, CNPJ, OS ou código (com ou sem hífen, maiúsculas ou minúsculas) */
function processoCorrespondeBusca(p, termo){
  var t = String(termo || '').trim().toLowerCase();
  if(!t) return true;
  if(nomeParaProcesso(p).toLowerCase().indexOf(t) !== -1) return true;
  var tn = soAlfaNum(t);
  if(tn.length < 3) return false;                                /* termos muito curtos só valem para o nome da empresa */
  var campos = [docParaProcesso(p), p.ordemServico, p.codigoAcompanhamento];
  for(var i = 0; i < campos.length; i++){
    var c = soAlfaNum(campos[i]);
    if(c && c.indexOf(tn) !== -1) return true;
  }
  return false;
}
/* bloco que aparece no detalhe do processo, só para a equipe */
function htmlCodigoAcompanhamento(p){
  var estilo = 'background:var(--surface-2); color:var(--ink-soft);';
  if(!p.codigoAcompanhamento){
    return '<span class="pill" style="'+estilo+' color:var(--ink-faint);">Sem código de acompanhamento</span>';
  }
  var c = esc(p.codigoAcompanhamento);
  return '<span class="pill" style="'+estilo+'">Código do cliente: <span class="mono" style="margin-left:.3em; font-weight:700;">'+c+'</span>'+
    '<button class="btn btn-ghost btn-sm" style="margin-left:.5em; padding:.15em .6em;" title="Copiar código" onclick="PS.copiarCodigo(\''+c+'\')">Copiar</button></span>';
}
function copiarCodigo(codigo){
  function feito(){ toast('Código copiado: '+codigo); }
  function reserva(){
    var ta = document.createElement('textarea');
    ta.value = codigo; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); feito(); }catch(e){ toast('Não foi possível copiar. Código: '+codigo); }
    document.body.removeChild(ta);
  }
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(codigo).then(feito, reserva); }
  else reserva();
}

function passosParaCliente(p){
  var s = SERVICE_MAP[p.servicoId];
  if(p.status === 'recusado') return [];
  if(p.status === 'solicitado'){      /* pedido do cliente ainda em análise pela equipe: nenhuma etapa do serviço começou */
    var ini = [{label:'Solicitação recebida — em análise pela equipe', state:'atual'}];
    if(!servicoSemPagamento(p.servicoId)) ini.push({label:'Pagamento confirmado', state:'pendente'});
    return ini.concat(s ? etapasDoProcesso(p).map(function(e){ return {label:e, state:'pendente'}; }) : []);
  }
  var steps = s ? stepStates(p, s) : [];
  return (servicoSemPagamento(p.servicoId) ? [] : [{label:'Pagamento confirmado', state: p.status==='aguardando_pagamento' ? 'atual' : 'concluida'}]).concat(steps);
}
function publicoDoProcesso(p){
  var s = SERVICE_MAP[p.servicoId], emp = getCompany(p.empresaId);
  return {
    v: 1,
    servico: s ? s.nome : '',
    empresa: emp ? emp.nome : ((p.empresaSolicitada && p.empresaSolicitada.nome) || ''),
    motivo: p.status === 'recusado' ? String(p.motivoRecusa || '').slice(0, 300) : undefined,

    passos: passosParaCliente(p).map(function(x){ return {t:x.label, s:x.state}; })
  };
}

/* só letras/números do código (O vira 0, I vira 1), em maiúsculas, no formato 0000-0000-0000 */
function codigoSoHex(v){ return String(v || '').toUpperCase().replace(/O/g, '0').replace(/I/g, '1').replace(/[^0-9A-F]/g, '').slice(0, 12); }
function codigoFormatado(hex){ return (hex.match(/.{1,4}/g) || []).join('-'); }
function clienteMascara(el){ el.value = codigoFormatado(codigoSoHex(el.value)); }
function clienteErro(msg){
  var el = document.getElementById('cli-erro'); if(!el) return;
  el.textContent = msg || ''; el.style.display = msg ? 'block' : 'none';
}
async function clienteConsultar(){
  var inp = document.getElementById('cli-codigo'); if(!inp) return;
  var hex = codigoSoHex(inp.value);
  if(hex.length !== 12){ clienteErro('Digite o código completo, no formato 0000-0000-0000.'); return; }
  var codigo = codigoFormatado(hex);
  if(!CLIENTE_API.consultar){ console.warn('CLIENTE_API.consultar não configurado.'); clienteErro('A consulta ainda não está disponível. Tente novamente mais tarde.'); return; }
  clienteErro('');
  var btn = document.getElementById('cli-btn'); btn.disabled = true; btn.textContent = 'Consultando…';
  var ctl = new AbortController(), tm = setTimeout(function(){ ctl.abort(); }, 25000);
  try{
    var resp = await fetch(CLIENTE_API.consultar, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({acao:'consultar', codigo:codigo}), signal: ctl.signal, cache:'no-store' });
    if(!resp.ok){ var corpoErro = ''; try{ corpoErro = (await resp.text()).slice(0, 400); }catch(e2){} throw new Error('HTTP '+resp.status+' '+corpoErro); }
    var j = await resp.json();
    if(j && j.ok === true && j.processo && Array.isArray(j.processo.passos)){
      consultaResultado = j.processo; consultaCodigo = codigo; render(); return;
    }
    btn.disabled = false; btn.textContent = 'Consultar';
    if(j && j.ok === false && j.erro === 'nao_encontrado') clienteErro('Nenhum processo encontrado com esse código. Confira se digitou corretamente.');

   SOLICITAÇÃO PELO CLIENTE (sem conta) + ANÁLISE PELA EQUIPE
   O cliente envia o pedido pelo fluxo "Criar" (Power Automate), que grava uma linha em
   Processos com status "solicitado", sem OS e sem empresa. A equipe vê esses pedidos na aba
   "Processos sem OS" e decide: aprovar (gera a OS e cadastra/reaproveita a empresa) ou recusar.

var AVISO_PRIVACIDADE = 'Os dados e documentos que você informar serão usados pela Lucralize apenas para analisar e executar o serviço solicitado. Ficam armazenados com acesso restrito à equipe e só serão compartilhados com órgãos públicos quando isso for necessário para realizar o serviço. Para pedir informações ou a exclusão dos seus dados, fale com a Lucralize.';

function cnpjValido(v){
  var d = String(v || '').replace(/\D/g, '');
  if(d.length !== 14 || /^(\d)\1+$/.test(d)) return false;
  function dv(base, pesos){ var soma = 0; for(var i = 0; i < pesos.length; i++) soma += parseInt(base.charAt(i), 10) * pesos[i]; var r = soma % 11; return r < 2 ? 0 : 11 - r; }
  var d1 = dv(d, [5,4,3,2,9,8,7,6,5,4,3,2]);
  var d2 = dv(d.slice(0, 12) + d1, [6,5,4,3,2,9,8,7,6,5,4,3,2]);
  return d1 === parseInt(d.charAt(12), 10) && d2 === parseInt(d.charAt(13), 10);
}
function formatarCnpj(d){ d = String(d || '').replace(/\D/g, ''); return d.length === 14 ? d.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})$/, '$1.$2.$3/$4-$5') : d; }

async function enviarSolicitacaoPublicaInterno(processo){
  var v = state.visitante || {};
  if(!v.aceite){ toast('Para enviar, é preciso concordar com o aviso de privacidade.'); return false; }
  if(!CLIENTE_API.criar){ toast('O envio de solicitações ainda não está disponível.'); return false; }
  var s = SERVICE_MAP[processo.servicoId];
  processo.status = 'solicitado'; processo.etapaAtual = -1; processo.ordemServico = '';

  processo.visitante = {nome:v.nome, telefone:v.telefone, email:v.email};
  processo.solicitanteContato = {telefone:v.telefone || '', email:v.email || ''};
  processo.empresaSolicitada = dadosEmpresaDoPedido(processo);
  processo.historico = [{data:todayISO(), hora:nowHM(), texto:'Solicitação de '+(s ? s.nome : 'serviço')+' enviada pelo cliente pelo portal. Aguardando análise da equipe Lucralize.', autor:'cliente'}];
  var corpo = {
    acao:'criar', website:v.website || '', aceite:true,
    servicoId:processo.servicoId, divisao:processo.divisao, status:'solicitado',
    empresaNome:processo.empresaSolicitada.nome, empresaCnpj:processo.empresaSolicitada.cnpj,
    processoJson:JSON.stringify(processo), publicoJson:JSON.stringify(publicoDoProcesso(processo))
  };
  if(corpo.processoJson.length > 29000){ toast('O formulário ficou grande demais para enviar. Reduza os textos livres e tente de novo.'); return false; }
  var ctl = new AbortController(), tm = setTimeout(function(){ ctl.abort(); }, 40000);
  try{
    var resp = await fetch(CLIENTE_API.criar, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(corpo), signal:ctl.signal, cache:'no-store'});
    if(!resp.ok){ var tx = ''; try{ tx = (await resp.text()).slice(0, 400); }catch(e2){} throw new Error('HTTP '+resp.status+' '+tx); }
    var j = await resp.json();
    if(j && j.ok === true && /^[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}$/.test(String(j.codigo || ''))){
      closePanel();
      var idOk = /^p[0-9a-f]{32}$/.test(String(j.processoId || ''));

      if(!idOk){ _anexos.forEach(function(a){ a.estado = 'falhou'; a.erro = 'Envio indisponível.'; }); }
      go({name:'link-publico', etapa:'confirmacao', codigo:j.codigo});
      if(idOk && _anexos.length && CLIENTE_API.enviar) setTimeout(enviarAnexosDoPedido, 60);
      else if(_anexos.length){ _anexos.forEach(function(a){ a.estado = 'falhou'; }); atualizarTelaDosAnexos(); }
      return true;
    }
    console.warn('Resposta do fluxo Criar:', j);
    toast(j && j.erro === 'pedido_invalido' ? 'Alguns dados do pedido não foram aceitos. Confira o formulário e tente novamente.' : 'Não foi possível registrar o seu pedido agora. Tente novamente em instantes.');
    return false;
  }catch(e){
    console.error('Envio da solicitação:', e);
    toast(e && e.name === 'AbortError' ? 'O envio demorou demais. Tente novamente.' : 'Não foi possível enviar o seu pedido. Verifique a internet e tente novamente.');
    return false;
  }finally{
    clearTimeout(tm);
  }
}

  var rows = await xlSelect('processos', true);

  if(!linha) return {sumiu:true};
  var fresco = rowParaProcesso(linha);
  state.processes = state.processes.map(function(x){ return x.id === id ? fresco : x; });

  return {p:fresco};
}

/* =========================================================
   ANEXOS DO CLIENTE (sem conta)
   Os arquivos escolhidos no formulário ficam guardados no navegador. Só depois que o pedido é
   registrado e o cliente recebe o código, cada arquivo sobe pelo fluxo "Enviar arquivo", que o
   grava em Documentos/<id do pedido>. O portal da equipe monta o caminho de download a partir
   do id do pedido e do nome combinado (campo do formulário + data + nome do arquivo).
   ========================================================= */
var ANEXO_TIPOS = ['pdf','jpg','jpeg','png','heic','doc','docx','xls','xlsx'];
var ANEXO_MAX_BYTES = 15 * 1024 * 1024;
var _anexos = [];            /* {nomeArq, nomeOriginal, file, estado:'aguardando'|'enviando'|'ok'|'falhou', erro} */
var _anexosPedido = null;    /* id do pedido (devolvido pelo fluxo "Criar") */
var _anexoSeq = 0;

function extensaoDe(nome){ var m = /\.([A-Za-z0-9]+)$/.exec(String(nome || '')); return m ? m[1].toLowerCase() : ''; }
function validarAnexo(file){
  if(!file) return 'Arquivo inválido.';
  if(ANEXO_TIPOS.indexOf(extensaoDe(file.name)) === -1) return 'Tipo de arquivo não aceito. Envie PDF, JPG, PNG, HEIC, Word ou Excel.';
  if(file.size === 0) return 'O arquivo está vazio.';
  if(file.size > ANEXO_MAX_BYTES) return 'O arquivo tem mais de 15 MB. Reduza o tamanho e tente de novo.';
  return '';
}
function nomeCurtoSeguro(nome){
  var ext = extensaoDe(nome), s = sanitizeFileName(nome);
  if(s.length > 80){ var base = s.slice(0, s.length - ext.length - 1); s = base.slice(0, 80 - ext.length - 1) + '.' + ext; }
  return s.replace(/\.\.+/g, '_');
}
/* chamado pelos formulários no lugar do envio real (cliente sem conta) */
function registrarAnexoDoCliente(file, subpasta){
  var erro = validarAnexo(file);
  if(erro){ var ev = new Error(erro); ev.amigavel = true; throw ev; }
  var slug = String(subpasta || 'anexo').split('/').pop().replace(/[^a-zA-Z0-9-]+/g, '-').slice(0, 40) || 'anexo';
  var nomeArq = slug + '__' + Date.now() + '-' + (++_anexoSeq) + '-' + nomeCurtoSeguro(file.name);
  _anexos.push({nomeArq:nomeArq, nomeOriginal:file.name, file:file, estado:'aguardando', erro:''});
  return {nome:file.name, path:null, pendenteUpload:true, nomeArq:nomeArq};
}
/* valida na hora em que o cliente escolhe o arquivo (antes do formulário inteiro ser preenchido) */
var _anexosIniciado = false;
function iniciarAnexosCliente(){
  if(_anexosIniciado) return; _anexosIniciado = true;
  document.addEventListener('change', function(e){
    var el = e.target;
    if(!el || el.type !== 'file' || currentUser()) return;
    var f = el.files && el.files[0]; if(!f) return;
    var erro = validarAnexo(f);
    if(erro){
      el.value = ''; e.stopImmediatePropagation();
      var txt = document.getElementById(el.id + '-txt'); if(txt) txt.textContent = 'Anexar arquivo';
      var row = el.closest && el.closest('.upload-row'); if(row) row.classList.remove('attached');
      toast(erro);
    }
  }, true);
  window.addEventListener('beforeunload', function(e){ if(_anexos.some(function(a){ return a.estado === 'aguardando' || a.estado === 'enviando'; })){ e.preventDefault(); e.returnValue = ''; } });
}
function lerBase64(file){
  return new Promise(function(res, rej){
    var r = new FileReader();
    r.onload = function(){ var s = String(r.result || ''), i = s.indexOf(','); res(i >= 0 ? s.slice(i + 1) : s); };
    r.onerror = function(){ rej(r.error || new Error('Falha ao ler o arquivo.')); };
    r.readAsDataURL(file);
  });
}
function atualizarTelaDosAnexos(){ if(state.view && state.view.name === 'link-publico' && state.view.etapa === 'confirmacao') render(); }
async function enviarUmAnexo(item){
  item.estado = 'enviando'; item.erro = ''; atualizarTelaDosAnexos();
  var b64;
  try{ b64 = await lerBase64(item.file); }
  catch(e){ item.estado = 'falhou'; item.erro = 'Não foi possível ler o arquivo.'; atualizarTelaDosAnexos(); return false; }
  for(var t = 1; t <= 3; t++){
    var ctl = new AbortController(), tm = setTimeout(function(){ ctl.abort(); }, 120000);
    try{
      var resp = await fetch(CLIENTE_API.enviar, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({acao:'enviar', processoId:_anexosPedido, nome:item.nomeArq, conteudoBase64:b64}), signal:ctl.signal, cache:'no-store'});
      if(!resp.ok) throw new Error('HTTP ' + resp.status);
      var j = await resp.json();
      if(j && j.ok === true){ item.estado = 'ok'; atualizarTelaDosAnexos(); return true; }
      if(j && j.erro === 'arquivo_invalido'){ item.estado = 'falhou'; item.erro = 'Arquivo não aceito.'; atualizarTelaDosAnexos(); return false; }
      throw new Error('resposta: ' + (j && j.erro));
    }catch(e){
      console.error('Envio do anexo "' + item.nomeOriginal + '" (tentativa ' + t + '):', e);
    }finally{
      clearTimeout(tm);
    }
    if(t < 3) await msEspera(1500 * t);
  }
  item.estado = 'falhou'; item.erro = 'Não foi possível enviar.'; atualizarTelaDosAnexos(); return false;
}
async function enviarAnexosDoPedido(){
  for(var i = 0; i < _anexos.length; i++){
    if(_anexos[i].estado === 'aguardando') await enviarUmAnexo(_anexos[i]);
  }
}
function reenviarAnexo(i){
  var it = _anexos[i]; if(!it || it.estado !== 'falhou') return;
  it.estado = 'aguardando'; it.erro = ''; atualizarTelaDosAnexos();
  enviarUmAnexo(it);
}
function anexosPendentes(){ return _anexos.some(function(a){ return a.estado === 'aguardando' || a.estado === 'enviando'; }); }
function htmlAnexosConfirmacao(){
  if(!_anexos.length) return '';
  var ok = _anexos.filter(function(a){ return a.estado === 'ok'; }).length, falhas = _anexos.filter(function(a){ return a.estado === 'falhou'; }).length;
  var pend = anexosPendentes();
  var titulo = pend ? 'Enviando arquivos ('+ok+' de '+_anexos.length+')…' : (falhas ? falhas+' arquivo'+(falhas === 1 ? '' : 's')+' não '+(falhas === 1 ? 'foi enviado' : 'foram enviados') : 'Todos os arquivos foram enviados.');
  var linhas = _anexos.map(function(a, i){
    var ic = {aguardando:'⏳', enviando:'⬆', ok:'✓', falhou:'⚠'}[a.estado];
    return '<div style="display:flex; align-items:center; gap:.5rem; font-size:.84rem; padding:.3rem 0;">'+
      '<span style="width:1.2rem; text-align:center;">'+ic+'</span>'+
      '<span style="flex:1; word-break:break-all;">'+esc(a.nomeOriginal)+'</span>'+
      (a.estado === 'falhou' ? '<button class="btn btn-ghost btn-sm" onclick="PS.reenviarAnexo('+i+')">Reenviar</button>' : '')+
    '</div>';
  }).join('');
  return '<div class="card" style="padding:.9rem 1.1rem; text-align:left; border:1px solid var(--border);">'+
    '<strong style="font-size:.9rem;">'+esc(titulo)+'</strong>'+linhas+
    (pend ? '<div style="font-size:.78rem; color:var(--warning); margin-top:.4rem;">Não feche esta página até terminar o envio.</div>' : '')+
    (!pend && falhas ? '<div style="font-size:.78rem; color:var(--ink-soft); margin-top:.4rem;">Toque em Reenviar. Se continuar falhando, entre em contato com a Lucralize informando o código acima.</div>' : '')+
  '</div>';
}
/* caminho de download dos arquivos que o cliente enviou (lado da equipe) */
function completarCaminhosDoCliente(p){
  (function andar(o){
    if(!o || typeof o !== 'object') return;
    if(Array.isArray(o)){ o.forEach(andar); return; }
    if(o.pendenteUpload && o.nomeArq && !o.path) o.path = p.id + '/' + o.nomeArq;
    Object.keys(o).forEach(function(k){ andar(o[k]); });
  })(p);
  return p;
}
/* =========================================================
   E-MAIL AO CLIENTE A CADA PASSAGEM DE ETAPA
   O texto do e-mail é gravado pela equipe, na MESMA gravação da etapa, na coluna EmailInfo da
   linha do processo. Depois o portal avisa o fluxo do Power Automate, mandando só o id do processo
   e o número do evento. O fluxo lê a coluna, confere o evento, envia em nome de
   processos@lucralize.com.br e registra o envio. O endereço do fluxo não aceita texto de ninguém:
   só consegue enviar o que a equipe já gravou na planilha, uma vez por evento.
   ========================================================= */
/* endereço que o cliente recebe no e-mail (troque aqui se o portal mudar de endereço) */
var PORTAL_URL_EMAIL = 'https://lucralize.github.io/portal-societario/';
function emailDoCliente(p){
  var e = String((p.solicitanteContato && p.solicitanteContato.email) || (p.visitante && p.visitante.email) || '').trim();
  return /^[^\s@<>"']+@[^\s@<>"']+\.[^\s@<>"']+$/.test(e) ? e : '';
}
function primeiroNome(p){
  var n = String((p.visitante && p.visitante.nome) || '').trim().split(/\s+/)[0] || '';
  return n.length > 40 ? n.slice(0, 40) : n;
}
function cortar(s, n){ s = String(s || ''); return s.length > n ? s.slice(0, n) : s; }
function novoIdEvento(){
  var b = new Uint8Array(16); crypto.getRandomValues(b);
  return Array.prototype.map.call(b, function(x){ return ('0' + x.toString(16)).slice(-2); }).join('');
}
function montarEmailEtapa(p, tipo, etapa, para){
  var s = SERVICE_MAP[p.servicoId], servico = s ? s.nome : 'serviço societário';
  var company = getCompany(p.empresaId), empresa = cortar(company ? company.nome : ((p.empresaSolicitada && p.empresaSolicitada.nome) || ''), 120);
  var nome = primeiroNome(p), autor = cortar(nomeAutorAtual(), 80);
  var link = PORTAL_URL_EMAIL;
  var situacao = tipo === 'concluido' ? 'foi <strong>concluído</strong>' : 'avançou para a etapa: <strong>' + esc(cortar(etapa, 120)) + '</strong>';
  var corpo = '<p>Olá' + (nome ? ', ' + esc(nome) : '') + '!</p>' +
    '<p>O seu processo de <strong>' + esc(servico) + '</strong>' + (empresa ? ' (' + esc(empresa) + ')' : '') + ' ' + situacao + '.</p>' +
    (p.codigoAcompanhamento ? '<p>Para acompanhar o andamento, acesse <a href="' + esc(link) + '">' + esc(link) + '</a>, clique em "Sou cliente" e depois em "Consultar serviço", e informe o código <strong>' + esc(p.codigoAcompanhamento) + '</strong>.</p>' : '') +
    '<p>Qualquer dúvida, é só responder este e-mail.</p>' +
    '<p>' + esc(autor) + '<br>Lucralize</p>';
  return {para: para, assunto: 'Atualização do seu processo — ' + servico, corpoHtml: corpo};
}
/* chamado ANTES de gravar a etapa: o e-mail vai junto, na mesma gravação (se a gravação falhar, nada sai) */
function prepararEmailDaEtapa(p, tipo, etapa){
  var para = emailDoCliente(p);
  if(!para) return null;
  var m = montarEmailEtapa(p, tipo, etapa, para);
  p.emailPendente = {evento: novoIdEvento(), para: m.para, assunto: m.assunto, corpoHtml: m.corpoHtml};
  p.historico.push({data:todayISO(), hora:nowHM(), texto:'E-mail ao cliente ('+para+') solicitado.', autor:nomeAutorAtual()});
  return p.emailPendente.evento;
}
/* chamado DEPOIS que a etapa foi gravada com sucesso; a falha daqui nunca desfaz a etapa */
async function dispararEmail(p){
  var ev = p.emailPendente && p.emailPendente.evento;
  if(!ev) return;
  if(!CLIENTE_API.email){ toast('A etapa foi atualizada, mas o envio de e-mail ainda não está configurado.'); return; }
  var ultimo = null;
  for(var t = 1; t <= 3; t++){
    var ctl = new AbortController(), tm = setTimeout(function(){ ctl.abort(); }, 30000);
    try{
      var resp = await fetch(CLIENTE_API.email, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({acao:'enviar', processoId:p.id, evento:ev}), signal:ctl.signal, cache:'no-store'});
      if(!resp.ok) throw new Error('HTTP ' + resp.status);
      var j = await resp.json();
      if(j && j.ok === true) return;
      throw new Error('resposta: ' + (j && j.erro));
    }catch(e){ ultimo = e; console.error('Aviso de e-mail (tentativa ' + t + '):', e); }
    finally{ clearTimeout(tm); }
    if(t < 3) await msEspera(1500 * t);
  }
  toast('A etapa foi atualizada, mas o e-mail ao cliente não foi disparado ('+cortar(ultimo && ultimo.message, 80)+'). Avise o cliente por outro meio.');
}
